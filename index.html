/* ---------- saved words: one list for books, messages and lessons ---------- */
// lector.words holds one entry per (word, language), newest first:
//   {w, lang, gloss, lemma, sentence, t, src, ...where it came from}
//   src 'book':    book, bookId, c, p, ct   (chapter index, paragraph, chapter title)
//   src 'message': from, mine, msgId, en    (Messages: en is the sentence in the other language)
//   src 'lesson':  lesson                    (Learn, part 2)
// A word's review card lives in lector.srs under the same key (wkey), so removing and saving a
// word again picks its memory back up.
const savedWords = () => { const w = LS.get('words', []); return Array.isArray(w) ? w : [] };
const wkey = x => (x.lang || 'es') + ':' + x.w;
const srcOf = x => x.src || 'book';
// Version 1 (before Learn) stored book words with no src. Fill in src and lang; never drop an entry.
// The untouched old list is kept once as lector.words.v1.
(function migrateWords(){
  if (LS.get('wordsV', 1) >= 2) return;
  const ws = savedWords();
  if (ws.length && LS.get('words.v1') == null) LS.set('words.v1', ws);
  LS.set('words', ws.map(x => Object.assign({}, x, {lang: x.lang || 'es', src: srcOf(x)})));
  LS.set('wordsV', 2);
})();
const langName = code => (T.langNames && T.langNames[code]) || LANGS[code] || code;
function srcLabel(x){
  const s = srcOf(x);
  if (s === 'message') return x.mine ? T.toMessage(x.from) : T.fromMessage(x.from);
  if (s === 'lesson') return T.fromLesson(x.lesson);
  if (s === 'claude') return T.acct.claudeSrc;
  return [x.book, x.ct].filter(Boolean).join(' · ');
}
// What a card asks about. A word saved inside a phrase ("funeral (pompas fúnebres)") is learned as the phrase.
function targetOf(x){
  if (!x || !x.w) return null;
  const g = String(x.gloss || ''), m = /^(.*) \(([^()]+)\)$/.exec(g);
  if (m && /\s/.test(m[2]) && foldText(m[2]).includes(foldText(x.w))) return {text: m[2], mean: m[1], phrase: true};
  return {text: x.w, mean: g};
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// The word's own sentence with the word cut out, trimmed to a readable window around it.
function clozeOf(x){
  const s = String(x.sentence || ''), tg = targetOf(x); if (!s || !tg) return null;
  const re = new RegExp('(?<![\\p{L}\\p{M}])' + escRe(tg.text).replace(/ /g, '\\s+') + '(?![\\p{L}\\p{M}])', 'iu');
  const m = re.exec(s); if (!m) return null;
  let a = 0, b = s.length;
  if (s.length > 220){
    a = Math.max(0, m.index - 110); b = Math.min(s.length, m.index + m[0].length + 110);
    while (a > 0 && /\S/.test(s[a - 1])) a--;
    while (b < s.length && /\S/.test(s[b])) b++;
  }
  return {before: (a ? '…' : '') + s.slice(a, m.index), word: m[0], after: s.slice(m.index + m[0].length, b) + (b < s.length ? '…' : '')};
}

/* ---------- reading time ---------- */
// Minutes count while a book is open on screen and someone has touched, scrolled or typed in the
// last three minutes, so a phone left open on the table doesn't count. Stored per language, in seconds.
let lastAct = Date.now(), lastTick = 0;
['scroll', 'click', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => { lastAct = Date.now() }, {passive:true, capture:true}));
function readTick(now = Date.now()){
  const dt = lastTick ? Math.min(now - lastTick, 30000) : 0; lastTick = now;
  if (view !== 'reader' || !book || document.visibilityState !== 'visible' || now - lastAct > 180000 || dt <= 0) return;
  const r = LS.get('read', {}), L = bookLang(book); r[L] = (r[L] || 0) + dt / 1000; LS.set('read', r);
}
setInterval(readTick, 15000);
document.addEventListener('visibilitychange', () => { lastTick = Date.now() });

/* ---------- reviews: FSRS ---------- */
// ts-fsrs 5.4.2 (MIT), vendored as ts-fsrs-5.4.2.js, schedules every card (FSRS-6 with its default
// weights, 90% target recall, short-term steps 1 min and 10 min, fuzzed intervals).
const F = typeof FSRS !== 'undefined' ? FSRS.fsrs(FSRS.generatorParameters({enable_fuzz: true})) : null;
const KNOWN_DAYS = 21;   // "a word you know": a review card whose memory lasts three weeks or more
const toStore = c => ({due: +c.due, s: c.stability, d: c.difficulty, e: c.elapsed_days || 0, sd: c.scheduled_days || 0, ls: c.learning_steps || 0,
  reps: c.reps, lapses: c.lapses, st: c.state, lr: c.last_review ? +c.last_review : 0});
const fromStore = o => ({due: new Date(o.due), stability: o.s, difficulty: o.d, elapsed_days: o.e || 0, scheduled_days: o.sd || 0, learning_steps: o.ls || 0,
  reps: o.reps || 0, lapses: o.lapses || 0, state: o.st || 0, last_review: o.lr ? new Date(o.lr) : undefined});
const srsAll = () => LS.get('srs', {});
const cardFor = (k, now = Date.now()) => { const o = srsAll()[k]; return o ? fromStore(o) : FSRS.createEmptyCard(new Date(now)) };
// Everything due in one language: overdue reviews first, the most forgotten first; then new words, oldest saved first.
function reviewPool(lang = studyLang(), now = Date.now()){
  if (!F) return [];
  const all = srsAll(), due = [], fresh = [], seen = new Set();
  for (const x of savedWords()){
    const k = wkey(x);
    if ((x.lang || 'es') !== lang || seen.has(k) || !targetOf(x)) continue;
    seen.add(k);
    const o = all[k];
    if (!o) fresh.push({k, x});
    else if (o.due <= now) due.push({k, x, r: F.get_retrievability(fromStore(o), new Date(now), false)});
  }
  // conjugation cards (es:cj:tener:pret) from the drill: due ones join the pile like any word
  for (const k in all){ const o = all[k]; if (k.startsWith(lang + ':cj:') && o.due <= now) due.push({k, x: null, r: F.get_retrievability(fromStore(o), new Date(now), false)}) }
  due.sort((a, b) => a.r - b.r);
  fresh.sort((a, b) => (a.x.t || 0) - (b.x.t || 0));
  return due.concat(fresh);
}
function nextDue(lang = studyLang(), now = Date.now()){
  const all = srsAll(); let min = Infinity;
  for (const x of savedWords()){ const o = (x.lang || 'es') === lang && all[wkey(x)]; if (o && o.due > now && o.due < min) min = o.due }
  for (const k in all) if (k.startsWith(lang + ':cj:') && all[k].due > now && all[k].due < min) min = all[k].due;
  return min < Infinity ? min : 0;
}
function wordStats(lang = studyLang()){
  const all = srsAll(), ws = savedWords().filter(x => (x.lang || 'es') === lang);
  let known = 0; for (const x of ws){ const o = all[wkey(x)]; if (o && o.st === 2 && o.s >= KNOWN_DAYS) known++ }
  return {saved: ws.length, known};
}
// The strength bar: how likely you are to still know the word a month from now.
function strengthOf(x, all = srsAll(), now = Date.now()){
  const o = all[wkey(x)]; if (!F || !o || !o.reps) return 0;
  return Math.round(100 * F.get_retrievability(fromStore(o), new Date(now + 30 * 864e5), false));
}
const normAns = s => String(s).toLowerCase().replace(/’/g, "'").replace(/\s+/g, ' ').trim();
const looseAns = s => normAns(s).normalize('NFD').replace(/\p{M}/gu, '');
function judge(typed, target){
  if (!String(typed || '').trim()) return '';
  if (normAns(typed) === normAns(target)) return 'right';
  return looseAns(typed) === looseAns(target) ? 'accent' : 'wrong';
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };
// Text for a link or a prompt is cut by grapheme (a letter with its accents, a whole emoji), never inside
// one: half an emoji is a lone surrogate, and encodeURIComponent throws on it. Code points as a fallback.
const SEG = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter(undefined, {granularity: 'grapheme'}) : null;
function cutText(s, n){
  s = String(s == null ? '' : s); if (s.length <= n) return s;
  let out = '';
  for (const g of SEG ? Array.from(SEG.segment(s), x => x.segment) : Array.from(s)){ if (out.length + g.length > n) break; out += g }
  return out;
}
const wellFormed = s => { s = String(s == null ? '' : s); return s.toWellFormed ? s.toWellFormed() : s.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '�') };
const safeUri = s => { try { return encodeURIComponent(s) } catch(e){ return encodeURIComponent(wellFormed(s)) } };
const askClaude = q => 'https://claude.ai/new?q=' + safeUri(q);
// English for a saved word's sentence: the message's own, the Start-here sentence, or the book's translations.
const trCache = new Map();
async function englishOf(x){
  if (x.en) return x.en;
  const k = sentKey(x.sentence || ''); if (!k) return null;
  for (const pk of Object.values(PACK)) if (pk.start.tr[k]) return pk.start.tr[k];
  if (!x.bookId) return null;
  if (!trCache.has(x.bookId)) trCache.set(x.bookId, DB.get(x.bookId).then(b => (b && b.tr) || {}).catch(() => ({})));
  return (await trCache.get(x.bookId))[k] || null;
}
// Card types: a cloze from the word's own sentence, meaning → word, word → meaning.
// A new word starts with word → meaning; after that the types take turns.
function cardTypes(x){ const t = ['recog']; if (targetOf(x).mean) t.push('produce'); if (clozeOf(x)) t.splice(1, 0, 'cloze'); return t }
function pickType(x, card){ const t = cardTypes(x); return card.reps ? t[card.reps % t.length] : 'recog' }
const srcIcon = x => { const s = srcOf(x); return `<svg class="icon sm" aria-hidden="true"><use href="#${s === 'message' ? 't-messages' : s === 'lesson' ? 't-learn' : s === 'claude' ? 'i-spark' : 'i-book'}"/></svg>` };

/* ---------- review session ---------- */
let rv = null;
function startReview(){
  if (!F) return toast(T.noFsrs);
  trCache.clear();
  const pool = reviewPool(studyLang()), n = Math.min(settings.reviewCap || 15, pool.length);
  if (!n) return renderLearn();
  let keys = pool.slice(0, n).map(p => p.k);
  // a conjugation card needs the verb tables: fetch them once, or leave those cards for later if offline
  if (keys.some(isCj) && !CJ.top && !startReview.tried){ startReview.tried = true; return loadTop().catch(() => {}).then(startReview) }
  startReview.tried = false;
  if (!CJ.top) keys = keys.filter(k => !isCj(k));
  if (!keys.length) return renderLearn();
  rv = {keys, i: 0, done: 0, lang: studyLang(), cur: null, n: new Set(keys).size, seen: new Set()};
  go('review');
}
function renderReview(){
  const v = $('#v-review');
  if (!rv) return go('learn');
  // The count is of the session's own cards: a card that comes back after a short learning step is shown
  // again without growing the total ("1 of 6" stays "of 6"), and the bar fills as cards are first answered.
  const total = rv.keys.length, n = rv.n || total, seen = rv.seen || new Set(), top = (i) => {
    const pos = i >= total ? n : Math.min(n, seen.size + (seen.has(rv.keys[i]) ? 0 : 1)), fill = i >= total ? n : seen.size;
    return `<div class="rtop"><button class="x" id="rvX" aria-label="${T.stopReview}">${icon('x')}</button>
      <div class="prog" role="img" aria-label="${T.cardOf(pos, n)}"><i style="width:${Math.round(100 * fill / Math.max(1, n))}%"></i></div><span class="cnt">${T.nOf(pos, n)}</span></div>` };
  if (rv.i >= total){
    const more = reviewPool(rv.lang).length;
    v.innerHTML = `${top(total)}<div class="done"><h2>${T.doneTitle}</h2><p>${T.doneLine(rv.done)}</p>
      ${more ? `<p>${T.doneMore(more)}</p><button class="primary" id="rvMore">${T.anotherRound}</button>` : `<p>${T.doneNone}</p>`}
      <button class="outline" id="rvBack">${T.backToLearn}</button></div>`;
    $('#rvX').onclick = $('#rvBack').onclick = () => { rv = null; go('learn') };
    const m = $('#rvMore'); if (m) m.onclick = startReview;
    return;
  }
  if (isCj(rv.keys[rv.i])) return renderCjReview(v, rv.keys[rv.i], top(rv.i));
  const k = rv.keys[rv.i], x = savedWords().find(y => wkey(y) === k);
  if (!x){ rv.seen.add(k); rv.i++; return renderReview() }   // removed from the list mid-session
  if (!rv.cur || rv.cur.at !== rv.i){ const card = cardFor(k); rv.cur = {k, x, card, type: pickType(x, card), at: rv.i, phase: 'front', typed: '', mode: 'type'} }
  const c = rv.cur, type = c.type;
  const L = x.lang || 'es', tg = targetOf(x), cz = type === 'cloze' ? clozeOf(x) : null, back = c.phase === 'back';
  let body = '';
  if (!back){
    if (type === 'cloze') body = `<div class="q">${T.qCloze}</div>
        <div class="sent" lang="${L}">${esc(cz.before)}<span class="gap" style="width:${Math.max(3, Math.min(9, tg.text.length * .6))}em" aria-hidden="true"></span><span class="sr">${T.blank}</span>${esc(cz.after)}</div>
        ${tg.mean ? `<div class="hint">${T.means} <b lang="en">${esc(tg.mean)}</b></div>` : ''}`;
    else if (type === 'produce') body = `<div class="q">${T.qProduce(langName(L))}</div><div class="mean" lang="en">${esc(tg.mean)}</div>`;
    else body = `<div class="q">${T.qRecog}</div><div class="bigw" lang="${L}">${esc(tg.text)}</div>
        <button class="hear" id="rvHear">${icon('sound1', 'sm')}${T.hearIt}</button>`;
    if (type !== 'recog'){
      const opts = type === 'cloze' ? c.opts || (c.opts = clozeChoices(x, tg)) : null;
      const choosing = c.mode === 'choose' && opts && opts.length > 1;
      body += choosing
        ? `<div class="opts" role="group" aria-label="${T.choices}">${opts.map(o => `<button lang="${L}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`
        : `<div class="ans"><input id="rvIn" lang="${L}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="${type === 'cloze' ? T.typeMissing : T.typeWord}" placeholder="${T.typeIt}"><button class="pill" id="rvCheck">${T.check}</button></div>`;

        ${x.lemma && foldText(x.lemma) !== foldText(tg.text) ? `<span style="color:var(--mute)">${T.fromLemma(`<i lang="${L}">${esc(x.lemma)}</i>`)}</span>` : ''}</div>`
        : x.lemma && foldText(x.lemma) !== foldText(tg.text) ? `<div class="fb" style="color:var(--mute)">${T.fromLemma(`<i lang="${L}">${esc(x.lemma)}</i>`)}</div>` : ''}
      <button class="hear" id="rvHear">${icon('sound1', 'sm')}${T.hearIt}</button></div>`;
  }

    </div>`;

    source: {kind: ['message', 'lesson'].includes(srcOf(x)) ? srcOf(x) : srcOf(x) === 'claude' ? 'other' : 'book', title: x.book || x.lesson || undefined, chapter: x.ct || undefined}});

  const show = () => { c.phase = 'back'; renderReview() };

  if (inp){ inp.value = c.typed; inp.oninput = () => { c.typed = inp.value }; inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); c.typed = inp.value; show() } } }
  if (chk) chk.onclick = () => { c.typed = inp.value; show() };
  const ch = $('#rvChoose'); if (ch) ch.onclick = () => { c.mode = 'choose'; c.typed = ''; renderReview() };
  v.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { c.typed = b.dataset.o; show() });
  v.querySelectorAll('[data-g]').forEach(b => b.onclick = () => gradeCard(+b.dataset.g));
  $('#rvWrong').onclick = () => reportCard({where: 'review', k, w: x.w, lang: L, type, asked: type === 'produce' ? tg.mean : tg.text, answer: tg.text, gloss: tg.mean, sentence: x.sentence || '', src: srcOf(x), source: srcLabel(x)});

function clozeChoices(x, tg){
  const L = x.lang || 'es', seen = new Set([normAns(tg.text)]), out = [];

let qz = null;
function buildQuiz(lang = studyLang(), n = 10){
  const seen = new Set(), pool = [];
  for (const x of shuffle(savedWords())){
    const t = targetOf(x); if ((x.lang || 'es') !== lang || !t || !t.mean || seen.has(normAns(t.text))) continue;
    seen.add(normAns(t.text)); pool.push(x);
  }
  if (pool.length < 4) return null;
  const qs = [];
  for (let i = 0; i < n; i++){
    const x = pool[i % pool.length], tg = targetOf(x), round = Math.floor(i / pool.length);
    const kinds = ['mean', 'word']; if (clozeOf(x)) kinds.push('cloze');
    const kind = kinds[(i + round) % kinds.length], field = kind === 'mean' ? 'mean' : 'text';
    const used = new Set([normAns(tg[field])]), opts = [tg[field]];
    for (const y of shuffle(pool)){ const o = targetOf(y)[field]; if (y !== x && !used.has(normAns(o))){ used.add(normAns(o)); opts.push(o) } if (opts.length === 4) break }
    qs.push({x, k: wkey(x), kind, tg, opts: shuffle(opts), answer: tg[field], picked: null});

/* ---------- grammar you can see: verb charts, tense timeline, pattern cards, the conjugation drill ---------- */
// Spanish tables live in conj/ (build_conj.py, from Wiktionary via kaikki.org). Each form carries a mark
// for the part that breaks the textbook pattern: irr (red), stem (orange), spell (blue). top.json holds the
// 300 most used verbs with their tables, so browsing, the glance list and the drill need that one file;
// any other verb is fetched from its two-letter shard, like the dictionary.
const G = () => T.gr || UI.en.gr;
const CONJ_DIR = 'conj/';
// Left out of browsing, "Irregulars at a glance" and the drill: verbs whose everyday sense is vulgar in
// Mexican Spanish (top.json ranks by frequency, which brings some of them into the top 300). A search for
// one still shows its chart, like a dictionary would.
const CONJ_SKIP = new Set(['cagar', 'coger', 'joder', 'chingar', 'follar', 'culear', 'mamar', 'mear', 'putear', 'pajear', 'encabronar', 'emputar']);
const TENSE_IDS = ['pres', 'pret', 'impf', 'fut', 'cond', 'sub', 'subi', 'imp', 'neg'];
const TGROUPS = [['ind', ['pres', 'pret', 'impf', 'fut', 'cond']], ['subj', ['sub', 'subi']], ['cmd', ['imp', 'neg']]];
const isImpT = t => t === 'imp' || t === 'neg';
const REFL = ['me', 'te', 'se', 'nos', 'se'], IMP_REFL = ['te', 'se', 'se'];
const SUBJ = ['yo', 'tú', 'él', 'nosotros', 'ellos'];
const CJ = {top: null, topP: null, shards: new Map(), gloss: new Map(), tidx: null};
const loadTop = () => CJ.topP || (CJ.topP = fetch(CONJ_DIR + 'top.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() })
  .then(d => (CJ.top = d)).catch(e => { CJ.topP = null; throw e }));
// The everyday verbs: top.json in frequency order, minus the vulgar and the archaic.
const topVerbs = () => CJ.top ? CJ.top.verbs.filter(v => !CONJ_SKIP.has(v) && CJ.top.tables[v] && !CJ.top.tables[v].old) : [];
const cjKey = (verb, tense) => `es:cj:${verb}:${tense}`;
const isCj = k => /^[a-z]{2}:cj:/.test(k);
// null: no such verb; undefined: its shard couldn't be fetched (offline).
async function conjOf(verb){
  verb = String(verb || '').toLowerCase().trim(); if (!verb) return null;
  if (CJ.top && CJ.top.tables[verb]) return CJ.top.tables[verb];
  const k = shardOf(verb);
  if (!CJ.shards.has(k)) CJ.shards.set(k, fetch(CONJ_DIR + k + '.json').then(r => r.ok ? r.json() : {}).catch(() => { CJ.shards.delete(k); return null }));
  const s = await CJ.shards.get(k);
  return s === null ? undefined : (s[verb] || null);
}
// What someone typed into the search: an infinitive, a form (tuve → tener) or a pronominal verb.
async function findVerb(q){
  q = String(q || '').toLowerCase().replace(/^(to|no)\s+/, '').replace(/[¡!¿?.,]/g, '').trim(); if (!q) return null;
  let t = await conjOf(q); if (t !== null) return t;
  if (/se$/.test(q)){ t = await conjOf(q.slice(0, -2)); if (t) return t }
  try { usePack('es'); const a = await analyze(q); if (a && a.status === 'ok' && a.lemma){ t = await conjOf(a.lemma); if (t) return t } } catch(e){}
  return null;
}
// The English for an infinitive ("to have"), from the same dictionary as the word card.
function verbGloss(inf){
  if (!CJ.gloss.has(inf)) CJ.gloss.set(inf, (async () => { try { usePack('es'); const a = await analyze(inf); return a.status === 'ok' ? a.best || '' : '' } catch(e){ return '' } })());
  return CJ.gloss.get(inf);
}
function fillGlosses(root){
  root.querySelectorAll('[data-gloss]').forEach(el => verbGloss(el.dataset.gloss).then(g => { if (g && el.isConnected) el.textContent = g }));
}
// Affirmative commands take the pronoun on the end (levántate, siéntese), which adds a written
// accent when the stress would otherwise land three syllables from the end.
function withClitic(form, pr){
  if (/[áéíóú]/.test(form)) return form + pr;
  const groups = []; const re = /[aeiouü]+/g; let m;
  while ((m = re.exec(form))){
    let s = m[0], at = m.index;
    if (s.length > 1 && s[0] === 'u' && /[qg]/.test(form[at - 1] || '') && /[ei]/.test(s[1])){ s = s.slice(1); at++ }   // que, gui: the u is silent
    groups.push({s, at});
  }
  if (groups.length < 2) return form + pr;   // ve → vete, pon → ponte
  const g = /[aeiouns]$/.test(form) ? groups[groups.length - 2] : groups[groups.length - 1];
  if (g === groups[groups.length - 1]) return form + pr;
  let i = g.s.search(/[aeo]/); if (i < 0) i = g.s.length - 1;   // a diphthong carries the accent on its strong vowel
  const p = g.at + i, acc = {a: 'á', e: 'é', i: 'í', o: 'ó', u: 'ú'}[form[p]] || form[p];
  return form.slice(0, p) + acc + form.slice(p + 1) + pr;
}
// One cell: the form, its mark, and what is shown before it ("no", "me").
function cellOf(t, tense, i){
  const raw = (t[tense] || [])[i]; if (raw == null) return null;
  const mark = (t.x && t.x[tense] && t.x[tense][i]) || 0;
  let pre = '', form = raw;
  if (t.se){ if (tense === 'imp') form = withClitic(raw, IMP_REFL[i]); else pre = (tense === 'neg' ? IMP_REFL[i] : REFL[i]) + ' ' }
  if (tense === 'neg') pre = 'no ' + pre;
  return {pre, form, mark, text: pre + form};
}

const REG_END = {

/* ---------- messages: a two-language chat with your language partner ---------- */
// The backend is the lector-chat Worker (chat-worker/ in this repo, on Brian's own Cloudflare). Every
// message comes back rendered in both thread languages; check-before-send and reply helpers run on
// Cloudflare's Workers AI. Messages never reach any other model.
const CHAT_API = 'https://lector-chat.brianfliesballoons.workers.dev';

// Who this phone is: the ONE place that knows. One token, kept on this phone: an invite token from
// ?join=… ('invite'), or a session from a passkey or Google ('session', see Acct below).
const Auth = {
  K: 'lector.chat.token', KK: 'lector.auth.kind',
  token(){ try { return localStorage.getItem(this.K) || '' } catch(e){ return '' } },
  kind(){ if (!this.token()) return ''; try { return localStorage.getItem(this.KK) === 'session' ? 'session' : 'invite' } catch(e){ return 'invite' } },
  setKind(k){ try { localStorage.setItem(this.KK, k === 'session' ? 'session' : 'invite') } catch(e){} },
  set(t, kind = 'invite'){ try { localStorage.setItem(this.K, t); this.setKind(kind) } catch(e){} },
  clear(){ try { localStorage.removeItem(this.K); localStorage.removeItem(this.KK) } catch(e){} },
  header(){ const t = this.token(); return t ? {Authorization: 'Bearer ' + t} : {} },
  // ?join=<token>: keep it, then take it out of the address bar (so out of history, bookmarks and screenshots).
  fromUrl(){
    let u; try { u = new URL(location.href) } catch(e){ return false }
    const t = u.searchParams.get('join'); if (t == null) return false;
    u.searchParams.delete('join');
    try { history.replaceState(history.state, '', u.pathname + u.search + u.hash) } catch(e){}
    if (!/^[A-Za-z0-9_-]{20,200}$/.test(t)) return false;
    if (this.kind() === 'session') return true;   // already signed in properly: the session stays (the invite may be retired)
    if (t !== this.token()){ this.set(t, 'invite'); chatForget(); acctForget(); Acct.joined = true }   // a different person on this phone: start clean
    return true;
  }
};

async function chatApi(method, path, body, signal){

/* Go deeper with a Lector ref (POST /context): the app stores what the card shows for 24 hours. The Worker answers
   {line: "Lector ref: lx-…", prompt}: `prompt` is the hand-off already framed (the question, then the sentence as
   quoted text that is not instructions, then the ref), so a connected Claude pulls the rest with get_context.
   That prompt is what goes in ?q=. Without a token, offline, before the answer comes, or from a Worker that
   sends no prompt, the prompt is built here as it always was. */
const refCache = new Map();
function refFor(info){
  if (!Auth.token() || !info || !info.word) return Promise.resolve(null);
  const k = Auth.token().slice(0, 8) + stable(info);
  if (!refCache.has(k)) refCache.set(k, acctApi('POST', '/context', info)
    .then(r => r && r.line ? {line: String(r.line), prompt: typeof r.prompt === 'string' && r.prompt.trim() ? r.prompt : null} : null)
    .catch(() => { refCache.delete(k); return null }));
  return refCache.get(k);
}
// A ?q= prompt that fits (~6 KB encoded), cut by grapheme. The ref paragraph at the end is kept whole: the
// question and the quote above it are what get shortened.
const Q_BYTES = 5800;
function fitQ(p){
  p = String(p || '').replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '');   // half an emoji (a cut made elsewhere): dropped
  if (safeUri(p).length <= Q_BYTES) return p;
  const at = p.lastIndexOf('\n\n('), tail = at > 0 ? p.slice(at) : '', headTxt = at > 0 ? p.slice(0, at) : p;
  let h = headTxt;
  while (h && safeUri(h + '…' + tail).length > Q_BYTES) h = cutText(h, Math.floor(h.length * 0.9));
  return h ? h + '…' + tail : cutText(tail, 1000);
}
// The Worker's prompt with the person's own (edited) question in place of the one it was framed with: its
// first line is the question (the Worker turns any line break in it into a space).
function withQuestion(p, q){
  const nl = p.indexOf('\n'), one = cutText(String(q).replace(/[\u0000-\u001f\u007f]/g, ' ').trim(), 400);
  return nl > 0 && one ? one + p.slice(nl) : p;
}
// For a plain Go-deeper link (review cards, the conjugation drill): the href gains the ref (and the Worker's
// framed prompt) when it arrives.
function wireDeep(a, promptOf, info){
  if (!a) return;
  a.href = askClaude(fitQ(promptOf(null)));
  refFor(info).then(r => { if (r && a.isConnected){ a.href = askClaude(fitQ(r.prompt || promptOf(r.line))); a.dataset.ref = r.line } });
}
const withRef = (q, line) => line ? q + '\n\n' + T.acct.refLine(line) : q;

/* ---------- profile sync (lector-chat › /sync; merge rules in chat-worker/src/sync.js) ---------- */
// The server merges entry by entry. This phone keeps a "shadow": a short hash and time of every entry as the
// server last had it. A push sends only entries that differ from it (an edit here is stamped now), a word
// removed here becomes a tombstone, and the merged answer is adopted, except entries changed on this phone
// while the request was out (they go in the next push). Book FILES never leave the phone: only the list.
const SYNC_MAPS = ['words', 'srs', 'progress', 'library', 'reports'];

  if (e.deleted) return true;

  if (k === 'srs' && ['due', 's', 'd', 'reps', 'lapses', 'st', 'lr'].some(f => e[f] !== undefined && e[f] !== null && !isNum(e[f]))) return false;

  srs(){ const s = LS.get('srs', {}); return plainObj(s) ? s : {} },

  library(){ const l = LS.get('library', {}); return plainObj(l) ? l : {} },

  wipeOK: '',      // the key they said yes to: the next push carries confirmWipe
  skip: new Set(), // keys the account holds in an old shape that the person chose to keep (no pushes this launch)
  st(){ const s = LS.get('sync', null); return plainObj(s) && plainObj(s.h) ? s : null },
  on(){ const t = Auth.token(); return !!t && this.dead !== t && !Owner.pending() },

        const t = first || !was || was[0] === 'D' ? Math.max(own, was && was[0] === 'D' && !first ? Math.min(now, +was[1] + 1) : 0) : Math.max(now, +was[1] + 1);
        const x = Object.assign({}, e, {t});
        if (syncable(k, id, x)) out[id] = x;
      }
      const gone = [];
      if (!first) for (const [id, v] of Object.entries(s)){ const [hh, tt] = v.split('|'); if (hh !== 'D' && !(id in m)){ gone.push(id); out[id] = {t: Math.max(now, +tt + 1), deleted: true} } }
      // More than SYNC_WIPE removed at once: only with the person's yes. Until then those removals wait
      // (everything else still syncs), and the person is asked.
      if (gone.length > SYNC_WIPE && this.wipeOK !== k){ for (const id of gone) delete out[id]; if (!held) held = {k, ids: gone, n: gone.length} }
      if (this.skip.has(k)) continue;
      if (Object.keys(out).length){ doc[k] = out; stamps[k] = now; n += Object.keys(out).length }
    }
    for (const k of SYNC_WHOLE){
      if (loc[k] == null || !plainObj(loc[k]) || (first && sh[k]) || sh[k] === hsh(loc[k]) || this.skip.has(k)) continue;
      doc[k] = loc[k]; stamps[k] = now; n++;
    }
    return {doc, stamps, n, held};
  },
  adopt(doc, start){
    const cur = this.read(), ch = this.hashes(cur), before = stable(ch);
    this.quiet = true;
    try {
      for (const k of SYNC_MAPS){
        if (doc[k] != null && !plainObj(doc[k])) continue;   // an old shape on the account: keep this phone's
        const out = Object.assign({}, plainObj(doc[k]) ? doc[k] : {});
        if (this.wipe && this.wipe.k === k && this.wipe.ids) for (const id of this.wipe.ids) if (!(id in cur[k])) delete out[id];   // held: stays removed here
        for (const [id, e] of Object.entries(cur[k])) if (!(id in out) && !syncable(k, id, Object.assign({}, e, {t: numT(e.t) || 1}))) out[id] = e;   // never went up: stays here
        for (const id of new Set([...Object.keys(ch[k]), ...Object.keys(start[k])])){
          if (ch[k][id] === start[k][id]) continue;
          this.again = true;                          // changed here while the request was out: keep it, push it next
          if (id in cur[k]) out[id] = cur[k][id]; else delete out[id];
        }
        SyncWrite[k](out);
      }
      for (const k of SYNC_WHOLE){
        if (ch[k] !== start[k]){ this.again = true; continue }
        if (plainObj(doc[k])) SyncWrite[k](doc[k]);
      }
      LS.set('notes', liveOf(doc.notes));
    } finally { this.quiet = false }
    return before !== stable(this.hashes(this.read())) || stable(doc.notes || {}) !== (this.notesWas || '');
  },
  // After a 409 conflict: bring in what the account has now, for every entry NOT changed on this phone since the
  // shadow `base`; entries changed here stay as they are and go in the retried push.
  rebase(doc, base){
    const cur = this.read();
    this.quiet = true;
    try {
      for (const k of SYNC_MAPS){
        if (doc[k] != null && !plainObj(doc[k])) continue;
        const b = base[k] || {}, srv = plainObj(doc[k]) ? doc[k] : {}, out = Object.assign({}, cur[k]); let ch = false;
        for (const id of new Set([...Object.keys(srv), ...Object.keys(b)])){
          const bh = b[id] ? b[id].split('|')[0] : '', was = bh && bh !== 'D' ? bh : '', here = id in cur[k] ? hsh(cur[k][id]) : '';
          if (here !== was) continue;                                    // changed here since the last sync: ours
          const e = srv[id];
          if (plainObj(e) && !e.deleted){ if (here !== hsh(e)){ out[id] = e; ch = true } }
          else if (id in out){ delete out[id]; ch = true }
        }
        if (ch) SyncWrite[k](out);
      }
      for (const k of SYNC_WHOLE){
        const here = cur[k] == null ? '' : hsh(cur[k]);
        if (here === (base[k] || '') && plainObj(doc[k]) && hsh(doc[k]) !== here) SyncWrite[k](doc[k]);
      }
    } finally { this.quiet = false }
  },
  // PUT with the conflict handled: a 409 that is not a wipe question re-pulls, merges, and pushes again (3 tries).
  async put(d, ctx){
    for (let i = 0; ; i++){
      try {
        const body = {doc: d.doc, stamps: d.stamps};
        if (this.wipeOK && this.wipeOK in d.doc) body.confirmWipe = true;
        return await acctApi('PUT', '/sync', body);
      } catch(e){
        if (e.status !== 409 || e.needsConfirm || i >= 2) throw e;
        await new Promise(r => setTimeout(r, 250 + Math.random() * 500 * (i + 1)));
        const srv = await acctApi('GET', '/sync');
        if (Auth.token() !== ctx.tok) throw Object.assign(new Error('switched'), {switched: true});
        if (ctx.base) this.rebase(srv.doc || {}, ctx.base);
        ctx.base = this.shadow(srv.doc || {});
        const loc = this.read(); ctx.start = this.hashes(loc);
        d = this.diff(ctx.base, loc, !ctx.base0);
        if (!d.n) return srv;
      }
    }
  },
  // Ask before a big removal reaches the account (from this phone, or one the Worker refused with needsConfirm).
  askWipe(w){
    if (this.asking) return; this.asking = true;
    const A = T.acct, what = A.wipeWhat[w.k] || A.wipeWhat.last;
    const sh = openSheet(`${head(`<h2 class="serif">${esc(A.wipeT)}</h2>`, A.wipeLater)}
      <p class="lede" id="wpLine">${esc(A.wipeLine(w.n, what))}</p>
      <button class="primary" id="wpKeep">${esc(A.wipeNo)}</button>
      <button class="outline" id="wpYes">${esc(A.wipeYes(w.n))}</button>`, 'tall', A.wipeT);
    const done = () => { this.asking = false; this.wipe = null };
    sh.querySelector('#wpYes').onclick = () => { done(); this.wipeOK = w.k; this.wipeN = w.n; closeSheet(); this.run() };
    sh.querySelector('#wpKeep').onclick = async () => { done(); closeSheet(); await this.keepGone(w); toast(A.wipeKept); this.run() };
    // "Not now" just closes: the removal stays held back (and unasked) until the app is opened again.
  },
  // "Keep them": put the removed entries back on this phone from the account (an old-shape key is left alone).
  async keepGone(w){
    if (!w.ids){ this.skip.add(w.k); return }
    try {
      const srv = await acctApi('GET', '/sync'), m = plainObj(srv.doc && srv.doc[w.k]) ? srv.doc[w.k] : {}, cur = SyncLocal[w.k]();
      for (const id of w.ids) if (plainObj(m[id]) && !m[id].deleted) cur[id] = m[id];
      this.quiet = true; try { SyncWrite[w.k](cur) } finally { this.quiet = false }
      afterSync();
    } catch(e){ this.skip.add(w.k) }
  },
  hold(held){ if (held || (this.wipe && this.wipe.ids)) this.wipe = held },   // a removal waiting for a yes (refreshed each run)
  async run(){
    if (!this.on()) return;
    if (this.busy){ this.again = true; return }
    this.busy = true; this.again = false; this.ranAt = Date.now(); clearTimeout(this.timer); this.timer = 0;
    const tok = Auth.token();
    try {
      if (!Acct.info || !Acct.info.user) await Acct.refresh();
      const uid = Acct.info.user.id;
      if (!Owner.arrive(Acct.info.user)) return;   // another person's words are on this phone: ask first
      let st = this.st(); if (st && st.uid !== uid) st = null;
      if (this.ensured !== uid){ await libEnsure(st); this.ensured = uid }   // once per launch: books added before accounts
      const loc = this.read(), ctx = {tok, base: st ? st.h : null, base0: !!st, start: this.hashes(loc)};
      let r, held = null;
      if (!st){
        const srv = await acctApi('GET', '/sync');
        const d = this.diff(this.shadow(srv.doc || {}), loc, true);
        r = d.n ? await this.put(d, ctx) : srv;
      } else {
        const d = this.diff(st.h, loc, false); held = d.held;
        if (d.n) r = await this.put(d, ctx);
        else {
          r = await acctApi('GET', '/sync?version=' + encodeURIComponent(st.v));
          if (r.unchanged){ st.at = Date.now(); LS.set('sync', st); this.hold(held); return }
        }
      }
      if (Auth.token() !== tok) return;           // signed out or switched while this was out
      if (this.wipeOK){ const n = this.wipeN; this.wipeOK = ''; this.wipeN = 0; if (n) toast(T.acct.wipeDone(n)) }
      this.hold(held);
      const doc = r.doc || {}, changed = this.adopt(doc, ctx.start);
      this.notesWas = stable(doc.notes || {});
      LS.set('sync', {uid, v: r.version, h: this.shadow(doc), at: Date.now()});
      if (changed) afterSync();
      libReconcile();
    } catch(e){
      if (e.switched) return;
      if (e.status === 401){ if (Auth.kind() === 'session') acctLost(); else this.dead = tok }
      else if (e.status === 413 && !this.warned){ this.warned = true; toast(T.acct.tooBig) }
      else if (e.status === 409 && e.needsConfirm){ this.wipeOK = ''; this.wipe = {k: e.key, n: e.removing, ids: null} }
      else if (e.status === 400){ this.dead = tok; if (!this.warnedBad){ this.warnedBad = true; toast(T.acct.syncBad) } console.warn('sync refused:', e.message) }
    } finally {
      this.busy = false; paintSyncLine();
      if (this.wipe && !this.asking) this.askWipe(this.wipe);
      if (this.again && this.on()){ clearTimeout(this.timer); this.due = Date.now() + 1200; this.timer = setTimeout(() => { this.timer = 0; this.run() }, 1200) }
    }
  }
};

/* ---------- whose words these are ---------- */
// The learning data on this phone (saved words, reviews, reading places, the book list) belongs to one person.
// When a DIFFERENT person opens an invite or signs in here, Lector asks before mixing them: keep them for the
// new person, or start fresh. Until that is answered nothing syncs, so nothing merges silently. Words saved
// before anyone signed in belong to whoever signs in first.
const LEARN_KEYS = {words: [], srs: {}, progress: {}, library: {}, reports: [], revlog: [], notes: {}, read: {}, last: null, 'chat.checked': {}, sync: null};
const Owner = {
  get(){ const o = LS.get('owner', null); return plainObj(o) && o.id ? o : null },
  set(u){ if (u && u.id) LS.set('owner', {id: u.id, name: u.name || ''}) },
  pending(){ const p = LS.get('owner.ask', null); return plainObj(p) && p.id ? p : null },
  hasData(){ return savedWords().length > 0 || Object.keys(SyncLocal.srs()).length > 0 || Object.keys(SyncLocal.progress()).length > 0 || Object.keys(SyncLocal.library()).length > 0 },
  // Phones that signed in before this existed: the person they knew is the owner.
  boot(){
    if (this.get()) return;
    const me = LS.get('chat.me', null), a = LS.get('account', null), st = LS.get('sync', null);
    if (me && me.id) this.set(me); else if (a && a.user && a.user.id) this.set(a.user); else if (st && st.uid) this.set({id: st.uid, name: ''});
  },
  // Someone (u) is using this phone now. True when the data is theirs (or no one's); false while asking.
  arrive(u){
    if (!u || !u.id) return true;
    const p = this.pending(); if (p) return p.id === u.id ? false : (this.ask(u), false);
    const o = this.get();
    if (!o || o.id === u.id || !this.hasData()){ this.set(u); return true }
    this.ask(u); return false;
  },
  // saved: 'all' (everything on the phone reached the earlier person's account), 'some' (it synced once, but
  // newer changes never got there) or '' (never synced). Read from the live sync record, or from the note
  // syncNote() left when a new invite or a sign-out cleared it, never from a record already wiped.
  ask(u){
    const o = this.get() || {};
    LS.set('owner.ask', {id: u.id, name: u.name || '', from: o.name || '', fromId: o.id || '', saved: this.savedFor(o.id)});
    showOwnerAsk();
  },
  savedFor(id){
    if (!id) return '';
    const st = Sync.st();
    if (st && st.uid === id && st.at){ let n = 1; try { const d = Sync.diff(st.h, Sync.read(), false); n = d.n + (d.held ? d.held.n : 0) } catch(e){} return n ? 'some' : 'all' }
    const k = LS.get('sync.last', null);
    return plainObj(k) && k.uid === id && k.at ? (k.all ? 'all' : 'some') : '';
  },
  keep(){ const p = this.pending(); if (!p) return; this.set(p); LS.set('owner.ask', null); LS.set('sync', null); LS.set('sync.last', null); Sync.dead = ''; Sync.run() },
  async fresh(){ const p = this.pending(); if (!p) return; await clearLearning(); this.set(p); LS.set('owner.ask', null); LS.set('sync.last', null); Sync.dead = ''; Sync.run() }
};
// Takes this phone's learning data away (never pushed as deletions: the sync shadow goes with it). Book files
// stay, but they are left off the next person's synced book list.
async function clearLearning(){
  let ids = []; try { ids = (await DB.all()).filter(b => !b.bundled).map(b => b.id) } catch(e){}
  Sync.quiet = true;
  try { for (const [k, v] of Object.entries(LEARN_KEYS)) LS.set(k, v); LS.set('lib.private', ids) } finally { Sync.quiet = false }
  trCache.clear();
  if (view === 'words') renderWords(); else if (view === 'learn') renderLearn(); else if (view === 'library') renderLibrary();
}
function showOwnerAsk(){
  const p = Owner.pending(); if (!p) return;
  const O = T.own, n = savedWords().length, from = p.from || O.someone, who = p.name || O.you;
  const sh = openSheet(`${head(`<h2 class="serif">${esc(O.title)}</h2>`, O.later)}

}

function libNote(b){
  const l = SyncLocal.library();
  l[b.id] = Object.assign({t: Date.now(), title: b.title || '', author: b.author || '', lang: bookLang(b), source: b.gid ? 'gutenberg' : 'upload'}, b.gid ? {gutenbergId: b.gid} : {});
  LS.set('library', l);

function libDrop(id){ const l = SyncLocal.library(); if (id in l){ delete l[id]; LS.set('library', l) } }
const isGone = (st, id) => !!(st && st.h && st.h.library && String(st.h.library[id] || '').startsWith('D|'));
// Books on this phone the list doesn't know yet (added before accounts): listed with the time they were added.
async function libEnsure(st){
  let all; try { all = await DB.all() } catch(e){ return }
  const l = SyncLocal.library(), priv = new Set(LS.get('lib.private', []) || []); let add = false;
  for (const b of all){
    if (b.bundled || l[b.id] || isGone(st, b.id) || priv.has(b.id)) continue;
    const t = /^u\d{12,}$/.test(b.id) ? +b.id.slice(1) : 1;
    l[b.id] = Object.assign({t, title: b.title || '', author: b.author || '', lang: bookLang(b), source: b.gid ? 'gutenberg' : 'upload'}, b.gid ? {gutenbergId: b.gid} : {});
    add = true;
  }
  if (add){ Sync.quiet = true; try { LS.set('library', l) } finally { Sync.quiet = false } }
}
// After a sync: a book removed on another device goes here too; a Gutenberg book listed but missing downloads again.
const restoring = new Map();   // book id -> 'dl' | 'fail'
async function libReconcile(){
  if (libReconcile.busy) return; libReconcile.busy = true;
  try {
    let ids; try { ids = await DB.keys() } catch(e){ return }
    const l = SyncLocal.library(), st = Sync.st(), have = new Set(ids);
    let changed = false;
    for (const id of ids) if (!l[id] && isGone(st, id)){ await DB.del(id); changed = true }   // bundled books are never in the list, so never "gone"
    if (changed && view === 'library') renderLibrary();
    for (const [id, e] of Object.entries(l)){
      if (have.has(id) || e.source !== 'gutenberg' || !e.gutenbergId || restoring.get(id) === 'fail' || !navigator.onLine) continue;
      await restoreFree(id, e);
    }
  } finally { libReconcile.busy = false }
}
async function restoreFree(id, e){
  restoring.set(id, 'dl'); if (view === 'library') renderLibrary();
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);
    const r = await fetch(BOOKS_PROXY + '/epub/' + encodeURIComponent(e.gutenbergId), {signal: ctl.signal});
    if (!r.ok) throw new Error('status ' + r.status);
    const buf = await r.arrayBuffer(); clearTimeout(timer);
    const book = await parseEpub(buf, langOf(e.lang) || settings.lang);
    if (!book.chapters.length) throw new Error('no readable text');
    Object.assign(book, {id, gid: e.gutenbergId, title: e.title || book.title, author: e.author || book.author, lang: langOf(e.lang) || book.lang});
    await DB.put(book); gids.add(e.gutenbergId); restoring.delete(id);
  } catch(err){ restoring.set(id, 'fail') }
  if (view === 'library') renderLibrary();
}

// The same cheap guess the Worker uses, so a message in the writer's own language skips the check.
function guessLang(text){
  const t = ' ' + text.toLowerCase() + ' ';
  const es = (t.match(/[ñ¿¡áéíóú]| (que|de|el|la|los|las|es|está|estoy|por|para|pero|muy|sí|yo|tú|mi|con|una?|como|qué|cómo|hola|gracias|bien) /g) || []).length;
  const en = (t.match(/ (the|is|are|and|you|i|to|of|it|my|what|how|but|very|yes|with|hello|thanks|good|do|don't|i'm) /g) || []).length;
  if (es && en && Math.min(es, en) / Math.max(es, en) > 0.34) return 'mixed';
  return es > en ? 'es' : en > es ? 'en' : null;
}

function pollDelay(){

async function poll(){

// New messages, late translations and deletions, by id. True when anything changed.
function merge(list){
  let changed = false;
  for (const m of list || []){
    const i = Chat.msgs.findIndex(x => x.id === m.id);
    if (m.deleted){ if (i >= 0){ Chat.msgs.splice(i, 1); changed = true } continue }
    if (i >= 0){ if (JSON.stringify(Chat.msgs[i]) !== JSON.stringify(m)){ Chat.msgs[i] = m; changed = true } }
    else {
      Chat.msgs.push(m); changed = true;
      if (Chat.me && m.from !== Chat.me.id && view !== 'messages'){ Chat.unread = true; paintTabs() }
    }
  }
  if (changed) Chat.msgs.sort((a, b) => a.id - b.id);
  return changed;
}

// The sentence in the other line that matches the tapped one: same position when both lines split

function matchSentence(text, other, sentence){
  const a = splitSentences(text.replace(/\s+/g, ' ')), b = splitSentences(other.replace(/\s+/g, ' '));
  const i = a.findIndex(x => x.s === sentKey(sentence));

// A word in a mixed message: whichever dictionary knows it, else the language of its sentence.
async function mixedLang(raw, sentence){

  usePack('es');
  const [es, en] = await Promise.all([exact(raw.toLowerCase()), enExact(raw.toLowerCase())]);
  const hasEs = !!(es && !es.offline), hasEn = !!(en && !en.offline);
  if (hasEs !== hasEn) return hasEs ? 'es' : 'en';
  const g = guessLang(sentence); return g === 'en' ? 'en' : 'es';
}

/* English words: the English to Spanish dictionary (dict/en/), same shards as the Spanish one */
let EN_DIR = 'dict/en/', enHas = null;
async function enReady(){
  if (enHas === null) enHas = fetch(EN_DIR + '_index.json').then(r => r.ok, () => null);
  const v = await enHas; if (v === null) enHas = null;   // offline: ask again next time
  return v;
}
async function enExact(w){
  if (!(await enReady())) return null;
  const path = EN_DIR + shardOf(w) + '.json';
  if (!shards.has(path)) shards.set(path, fetch(path).then(r => r.ok ? r.json() : {}).catch(() => { shards.delete(path); return null }));
  const s = await shards.get(path);
  return s === null ? {offline: true} : (s[w] || null);
}
// Everyday words whose first Wiktionary meaning is the wrong one for a beginner ("hen" is not "mujer", "pen" is
// not "corral", "I miss you" is not "fallar"). Past forms (came, found, ran) need no entry here: a form of a verb
// is shown as that verb (enVerbForm).
const EN_CORE = {cat: ['noun', 'gato, gata'], mat: ['noun', 'tapete'], hen: ['noun', 'gallina'], pen: ['noun', 'pluma, bolígrafo'],
  miss: ['verb', 'extrañar (I miss you = te extraño); perder (el autobús)'], hello: ['intj', 'hola'], goodbye: ['intj', 'adiós'],
  hot: ['adj', 'caliente; caluroso (el clima)'], berry: ['noun', 'mora, baya'], years: ['noun', 'años'], end: ['noun', 'fin, final'],
  lot: ['noun', 'a lot: mucho'], times: ['noun', 'veces'], room: ['noun', 'cuarto, habitación'], him: ['pron', 'lo, le, (a) él'], them: ['pron', 'los, las, les, (a) ellos'],
  going: ['verb', 'yendo (de go); going to = ir a'], doing: ['verb', 'haciendo (de do)'], growing: ['verb', 'creciendo (de grow)']};
async function lookupEn(raw){
  const w = raw.toLowerCase().replace(/’/g, "'");
  const a = await lookupEnRaw(raw), core = EN_CORE[w];
  if (!core || a.status === 'offline' || a.status === 'soon') return a;
  const d = [core[0], '', [core[1]]];
  return Object.assign({}, a, {status: 'ok', best: core[1], pos: core[0], defs: [d, ...(a.defs || [])], core: true, lemma: undefined, also: undefined, uncertain: false});
}
async function lookupEnRaw(raw){
  const w = raw.toLowerCase().replace(/’/g, "'");
  const ready = await enReady();
  if (ready === null) return {status: 'offline'};
  if (!ready) return {status: 'soon'};
  let rec = await enExact(w);
  if (rec && rec.offline) return {status: 'offline'};
  if (!rec && /'s$/.test(w)) rec = await enExact(w.slice(0, -2));   // possessives: the dog's, the dogs'
  if (!rec && /s'$/.test(w)) rec = await enExact(w.slice(0, -1));
  if (!rec && /'/.test(w) && unstress(w) !== w) rec = await enExact(unstress(w));   // a first reader's stress mark: rid'ing
  if (!rec) return {status: 'notfound'};
  const out = {status: 'ok', uncertain: !!rec.r};
  let main = rec;
  // fl: the form reading comes first (saw: the past of see, before "sierra"); otherwise it is a footnote.
  if (rec.f && rec.f.length && rec.d && !rec.fl){ out.also = {lemma: rec.f[0][0], label: rec.f[0][1] || ''} }
  else if (rec.f && rec.f.length){
    const [lemma, label] = rec.f[0], lr = await enExact(lemma);
    if (lr && lr.d){ out.lemma = lemma; out.label = label || ''; main = lr; out.uncertain = !!lr.r }
  }
  // A verb form (ran, left, riding, runs): every label it carries for its verb, and that verb's meanings,
  // so the card can show it as the verb (enVerbForm) whichever branch led.
  const vf = (rec.f || []).find(f => EN_VLAB.has(f[1]));
  if (vf){
    const lr = vf[0] === out.lemma ? main : await enExact(vf[0]);
    if (lr && lr.d && lr.d.some(d => d[0] === 'verb')) out.vf = {lemma: vf[0], labels: rec.f.filter(f => f[0] === vf[0]).map(f => f[1]), defs: lr.d, uncertain: !!lr.r};
  }
  if (!main.d || !main.d.length) return {status: 'notfound'};
  out.best = main.d[0][2][0]; out.pos = main.d[0][0]; out.defs = main.d;
  if (main !== rec && rec.d) out.own = rec.d;

}
/* A form of a verb is shown as that verb ("ran": corrió, not the noun "carrera"). The labels come from the
   dictionary (pasado, participio, gerundio (-ing), 3.ª persona); the word before picks between them and can
   say a thing is meant instead ("the saw", "a thought"). */
const EN_VLAB = new Set(['pasado', 'participio', 'gerundio (-ing)', '3.ª persona']);
const EN_HAVE = new Set("have has had having 've 'd i've you've we've they've i'd you'd he'd she'd we'd they'd".split(' '));
const EN_BE = new Set("am is are was were be been being 'm 're i'm you're we're they're he's she's it's".split(' '));
const EN_SUBJ = new Set("it who".split(' '));

  if (!a.vf || a.core) return null;

  const own = a.lemma ? a.own : a.ownDefs;   // the word's own meanings: sierra for saw, carrera for running
  if (nounCue(prev) && (labels.includes('plural') || (own && own.some(d => d[0] !== 'verb')))) return null;   // "the saw", "the runs"
  const pick = EN_HAVE.has(prev) && vl.includes('participio') ? 'participio'
    : EN_BE.has(prev) && vl.includes('gerundio (-ing)') ? 'gerundio (-ing)'
    : EN_BE.has(prev) && vl.includes('participio') ? 'participio'

    try { await chatApi('POST', '/report', {kind: 'check', context: {text, lang: r.lang, edits}}); toast(T.fixReported) } catch(e){ toast(T.cantSave) }
  };
  return sh;
}

/* reply helpers: three replies, each with a way to understand it before choosing */
async function openHelpers(){
  const last = [...Chat.msgs].reverse().find(m => m.from !== Chat.me.id), p = partner();
  const prefs = Chat.thread.prefs || {}, day = Chat.thread.languageDay;
  let lang = prefs.helperLang || (day && day.suggest) || Chat.me.learning, open = -1, data = null, ctl = null, t0 = 0, tick = null;
  const lastHtml = last ? (() => { const L = linesOf(last); return `<div class="hlast"><div class="kicker">${esc(T.replyingTo(p.name || ''))}</div><div class="es" lang="${L.ol === 'mixed' ? '' : L.ol}">${esc(L.o)}</div>${L.t ? `<div class="tr" lang="${L.tl}">${esc(L.t)}</div>` : ''}</div>` })() : '';
  const paint = () => {
    const seg = (Chat.thread.langs || ['es', 'en']).map(l => `<button data-hl="${l}" aria-pressed="${l === lang}">${esc(T.inLang(langName(l)))}</button>`).join('');
    let list;
    if (!last) list = `<p class="calm">${T.helpersNone}</p>`;
    else if (!data) list = `<div class="hwait" id="hWait"><p class="calm">${T.helpersLoading}</p>
        <div class="bar" role="progressbar" aria-label="${T.helpersLoading}" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0"><i id="hBar" style="width:0%"></i></div>
        <p class="small" id="hSecs" style="margin:0;padding:0">${T.helpersTime(0)}</p><button class="outline" id="hStop">${T.cancel}</button></div>`;
    else if (data.stopped) list = `<p class="calm" id="hStopped">${T.helpersStopped}</p><button class="outline" id="hRetry">${T.tryAgain}</button>`;
    else if (!data.replies.length) list = `<p class="calm">${data.unavailable ? T.helpersRest : T.helpersNone}</p>`;
    else list = data.replies.map((r, i) => `<div class="hcard" data-i="${i}">
        <span class="tone">${esc(r.tone)}</span>
        <div class="htext" lang="${data.lang}">${esc(r.text)}</div><div class="htr">${esc(r.translation)}</div>
        ${open === i ? `<div class="hparts">${r.understand.map(u => `<div class="hp"><span class="w2" lang="${data.lang}">${esc(u.w)}</span><span>${esc(u.m)}</span></div>`).join('')}
          <div class="hwhy"><b>${T.whyWorks}</b> ${esc(r.why)}</div></div>` : ''}
        <div class="two"><button data-u="${i}" aria-expanded="${open === i}">${open === i ? T.hide : T.understand}</button><button class="usebtn" data-p="${i}">${T.useThis}</button></div></div>`).join('')
      + `<a class="tipbtn wide" id="hCmp" target="_blank" rel="noopener">${T.compareClaude}${icon('out','sm')}</a><button class="wrongb" id="hWrong">${T.helpWrong}</button>`;
    const sh = openSheet(`${head(`<h2 class="serif">${T.threeWays}</h2>`, T.close)}${lastHtml}<div class="seg hseg" role="group" aria-label="${T.replyLang}">${seg}</div>${list}`, 'tall', T.threeWays);
    sh.querySelectorAll('[data-hl]').forEach(b => b.onclick = () => {
      if (b.dataset.hl === lang) return;
      lang = b.dataset.hl; data = null; open = -1; fetchIt();
      chatApi('PUT', '/prefs', {thread: Chat.thread.id, helperLang: lang}).then(d => { Chat.thread.prefs = d.prefs }).catch(() => {});
    });
    sh.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { open = open === +b.dataset.u ? -1 : +b.dataset.u; const y = sh.scrollTop; paint(); $('#sheet').scrollTop = y });
    sh.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      const inp = $('#cIn'); inp.value = data.replies[+b.dataset.p].text; closeSheet();
      inp.dispatchEvent(new Event('input')); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    });
    const cmp = $('#hCmp');
    if (cmp) cmp.href = askClaude(briefing({kind: 'replies', lang: data.lang, last: last.text, replies: data.replies, question: T.compareQ, convo: convoAround(last.id)}));
    const wr = $('#hWrong');
    if (wr) wr.onclick = async () => { try { await chatApi('POST', '/report', {kind: 'helper', context: {replyTo: data.replyTo, lang: data.lang, replies: data.replies}}); toast(T.helpReported) } catch(e){ toast(T.cantSave) } };
    const st = $('#hStop'); if (st) st.onclick = () => { if (ctl) ctl.abort() };
    const rt = $('#hRetry'); if (rt) rt.onclick = fetchIt;
    progress();
  };
  // The helpers can take up to a minute: a bar and a seconds count while they think, and Cancel.
  const progress = () => {
    const b = $('#hBar'), x = $('#hSecs');
    if (!b || !tick){ return }
    const sec = Math.round((Date.now() - t0) / 1000);
    b.style.width = Math.min(96, 100 * sec / 60) + '%'; b.parentElement.setAttribute('aria-valuenow', Math.min(60, sec)); x.textContent = T.helpersTime(sec);
  };
  const fetchIt = async () => {
    if (ctl) ctl.abort();
    data = null; ctl = null; clearInterval(tick); tick = null; paint(); if (!last) return;
    const want = lang, mine = ctl = new AbortController();
    t0 = Date.now(); tick = setInterval(() => { if (!$('#sheet').classList.contains('open') || !$('#hBar')){ if (!$('#sheet').classList.contains('open')){ clearInterval(tick); tick = null } return } progress() }, 500);
    try { const d = await chatApi('POST', '/helpers', {thread: Chat.thread.id, lang}, mine.signal); if (mine === ctl && want === lang && $('#sheet').classList.contains('open')){ clearInterval(tick); tick = null; data = d; paint() } }
    catch(e){
      if (mine !== ctl) return;
      clearInterval(tick); tick = null;
      if (e.name === 'AbortError'){ data = {replies: [], stopped: true, lang}; if ($('#sheet').classList.contains('open')) paint(); return }
      if (want === lang){ data = {replies: [], unavailable: e.status === 429, lang}; paint(); if (e.status === 429) toast(e.message) }
    }
  };
  fetchIt();
}

// From Words: back to the message a word was saved from, with the word lit up.
function openMsgWord(x){
  go('messages');
  const t0 = Date.now(), find = () => {
    const el = document.querySelector(`#msgs .msg[data-id="${+x.msgId}"]`);
    if (el){
      el.scrollIntoView({block: 'center'});
      el.querySelectorAll('.w').forEach(s => { if (s.textContent.toLowerCase() === x.w){ s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 2500) } });
      return;
    }
    if (Date.now() - t0 < 6000) setTimeout(find, 200); else toast(T.msgGone);
  };
  setTimeout(find, 60);
}

/* ---------- words tab ---------- */

  const shown = ws.map((x, i) => [x, i]).filter(([x]) => wordsFilter === 'all' || (wordsFilter === 'claude' ? fromClaude(x) : srcOf(x) === wordsFilter));

        <button class="outline" id="wGo" style="width:auto;padding:0 18px">${T.goLibrary}</button></div>`

        return `<li><button data-i="${i}" data-src="${srcOf(x)}"><span class="h"><span class="wt"><b lang="${lg}">${esc(x.w)}</b><span>${esc(x.gloss || '')}</span></span>

        ${x.sentence ? `<span class="ctx" lang="${lg}">${esc(ctxOf(x.sentence, x.w))}</span>` : ''}${(n => n ? `<span class="cnl">${icon('spark', 'sm')}<b>${T.acct.fromClaude}:</b> ${esc(n.items[0].text)}</span>` : '')(noteFor(lg, x.w, NT))}<span class="src" lang="${lg}">${esc(srcLabel(x))}${lg !== L ? ' · ' + langName(lg) : ''}</span></button></li>` }).join('')}</ul>
      <p class="small">${T.strengthNote}</p>`}`;
  const g = $('#wGo'); if (g) g.onclick = () => go('library');

/* ---------- offline dictionary ---------- */
// Downloads every shard of one language once, through the service worker, so lookups work with
// no signal. Each language is saved separately (Spanish under "offline", French "offline.fr").
const offKey = code => code === 'es' ? 'offline' : 'offline.' + code;
const offs = {};
const offOf = code => offs[code] || (offs[code] = {state: LS.get(offKey(code)) ? 'saved' : 'none', pct: 0});
const off = offOf('es');   // kept for the test harness and older notes: the Spanish state
function paintOffline(){
  const c = $('#offCard'); if (!c) return;
  const pk = PACK[settings.lang], o = offOf(pk.code), O = T.set.off, name = langName(pk.code);
  if (o.state === 'saved') c.innerHTML = `<div class="st">${icon('check')}<span>${esc(O.saved(name))}</span></div><p>${esc(O.savedLine)}</p>`;
  else if (o.state === 'saving') c.innerHTML = `<div class="st"><span>${esc(O.saving(name, o.pct))}</span></div><div class="bar"><i style="width:${o.pct}%"></i></div><p>${esc(O.savingLine(pk.size))}</p>`;
  else c.innerHTML = `<div class="st"><span>${esc(o.state === 'failed' ? O.failed : O.notSaved(name))}</span></div>
    <p>${esc(O.notSavedLine(pk.size))}</p><button class="primary" id="offBtn">${esc(o.state === 'failed' ? O.retry : O.save)}</button>`;
  const b = $('#offBtn'); if (b) b.onclick = () => saveDictionary(pk.code);
}
async function saveDictionary(code = settings.lang){
  const o = offOf(code), dir = PACK[code].dict;
  if (o.state === 'saving') return;
  o.state = 'saving'; o.pct = 0; paintOffline();
  try {
    if ('serviceWorker' in navigator){
      await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(r, 5000))]);
      if (!navigator.serviceWorker.controller) await new Promise(r => { navigator.serviceWorker.addEventListener('controllerchange', r, {once:true}); setTimeout(r, 4000) });
    }
    const keys = await (await fetch(dir + '_index.json')).json();
    for (let i = 0; i < keys.length; i += 6){
      const rs = await Promise.all(keys.slice(i, i + 6).map(k => fetch(dir + k + '.json')));
      if (rs.some(r => !r.ok)) throw new Error('fetch');
      o.pct = Math.min(100, Math.round(100 * (i + 6) / keys.length)); paintOffline();
    }
    // Only claim "saved" if it really is in the offline cache.
    const ok = 'caches' in window && await caches.match(dir + keys[keys.length - 1] + '.json');
    if (!ok) throw new Error('not cached');
    LS.set(offKey(code), Date.now()); o.state = 'saved';
  } catch(e){ o.state = 'failed' }
  paintOffline();
}
// Saved automatically on Wi-Fi the first time a language is used (a book in it is opened).
function autoSaveDictionary(code = settings.lang){
  if (offOf(code).state !== 'none' || !navigator.onLine) return;
  const cn = navigator.connection; if (cn && (cn.saveData || cn.type === 'cellular')) return;
  setTimeout(() => { if (document.visibilityState === 'visible') saveDictionary(code) }, 4000);
}
