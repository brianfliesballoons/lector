<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf7f2">
<title>Lector</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Lora:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script>
// Set the theme before first paint so a dark phone never flashes white.
try { var s = JSON.parse(localStorage.getItem('lector.settings') || '{}'), t = s.theme || 'auto';
  var m = s.match != null ? s.match : t === 'auto'; if (t === 'auto') t = 'light';
  if (m) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t } catch(e){ document.documentElement.dataset.theme = 'light' }
</script>
<script src="jszip.min.js"></script>
<script src="ts-fsrs-5.4.2.js"></script>
<style>
:root,:root[data-theme=light]{
  --bg:#faf7f2;--ink:#1f1c17;--ink2:#4a443a;--mute:#6f6759;--line:#e7e0d4;--line2:#efe9df;--card:#ffffff;--accent:#9a4420;--accent-ink:#ffffff;
  --soft:#f3ebde;--hl:#f7e1b5;--tip:#fff3dd;--tipline:#ecd6a8;--cur:#fbf3e6;--shadow:rgba(31,28,23,.12);--scrim:rgba(31,28,23,.42);--grab:#d9d1c3;--field:#d9d1c3;
  --ok:#2f6b3a;--easy:#2f6b3a;--med:#8a5a10;--hard:#9a3328;color-scheme:light}
:root[data-theme=sepia]{--bg:#f3e7d0;--ink:#3b2f22;--ink2:#54452f;--mute:#6e5c45;--line:#e0cfae;--line2:#e8dabd;--card:#f9efdc;--accent:#8a3d1b;--accent-ink:#ffffff;
  --soft:#efdcbc;--hl:#ecd08f;--tip:#f6e2bd;--tipline:#dcc08a;--cur:#f1e1c2;--shadow:rgba(80,50,20,.16);--scrim:rgba(59,47,34,.42);--grab:#d6c39f;--field:#d6c39f;
  --ok:#3d6b2f;--easy:#3d6b2f;--med:#7c4f0c;--hard:#8f2f24;color-scheme:light}
:root[data-theme=dark]{--bg:#1a1917;--ink:#e8e2d6;--ink2:#cfc7b8;--mute:#9a9284;--line:#34312b;--line2:#2e2b26;--card:#24221f;--accent:#e8955f;--accent-ink:#1a1917;
  --soft:#3a2c22;--hl:#5b4524;--tip:#2e2618;--tipline:#4d3d22;--cur:#2c2620;--shadow:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.55);--grab:#4a463f;--field:#4a463f;
  --ok:#8cc78a;--easy:#8cc78a;--med:#e0b25c;--hard:#ee8f7f;color-scheme:dark}
:root[data-theme=black]{--bg:#000000;--ink:#d8d2c6;--ink2:#c0b9ab;--mute:#8a8378;--line:#222222;--line2:#1a1a1a;--card:#111111;--accent:#e8955f;--accent-ink:#000000;
  --soft:#2a1f17;--hl:#4a3a1f;--tip:#1c160e;--tipline:#3a2e1a;--cur:#1a1510;--shadow:rgba(0,0,0,.7);--scrim:rgba(0,0,0,.6);--grab:#333333;--field:#333333;
  --ok:#8cc78a;--easy:#8cc78a;--med:#e0b25c;--hard:#ee8f7f;color-scheme:dark}
:root{--fs:20px;--lh:1.7;--mw:36em;--font:'Literata',Georgia,serif;--align:left;
  --ui:'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--serif:'Literata',Georgia,serif;
  --top:calc(env(safe-area-inset-top) + 20px);--tabh:calc(env(safe-area-inset-bottom) + 62px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding:calc(env(safe-area-inset-top) + 64px) 0 calc(env(safe-area-inset-bottom) + 80px)}
html,body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{transition:background .25s,color .25s}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--accent);color:var(--accent-ink);border:none;font-weight:700;font-size:17px;min-height:52px;border-radius:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:17px;min-height:48px;border-radius:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:700;flex:none}
.link{background:none;border:none;padding:8px 0;color:var(--accent);font-weight:700;font-size:16px;text-align:left;min-height:44px}
.hide{display:none!important}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.sm{width:18px;height:18px}
.note{color:var(--mute);font-size:15px;line-height:1.5}
.es{font-family:var(--serif)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- tab views ---------- */
.view{max-width:720px;margin:0 auto;padding:var(--top) 20px calc(var(--tabh) + 30px);display:flex;flex-direction:column;gap:22px}
.view h1{margin:0;font-family:var(--serif);font-weight:600;font-size:32px;letter-spacing:-.3px;line-height:1.2}
.view h2{margin:0;font-size:20px;font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.kick{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:6px 0 calc(env(safe-area-inset-bottom) + 8px)}
#tabs button{border:none;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:0;color:var(--mute);font-size:12px;font-weight:700;min-width:0}
#tabs .icon{stroke-width:1.8}#tabs button[aria-current=page] .icon{stroke-width:2}
#tabs button[aria-current=page]{color:var(--accent)}
#tabs .icon{width:24px;height:24px}

/* library */
.start p.es{margin:0;font-size:21px;line-height:1.55}
.start .lead{font-size:17px;line-height:1.4}
.peek{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:10px 12px;background:var(--bg);border-radius:10px}
.peek b{font-family:var(--serif);font-size:17px;font-weight:600}
.peek span{font-size:17px}
.peek small{font-size:14px;color:var(--mute);margin-left:auto}
.cont{display:flex;gap:16px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%}
.cont .cover{width:64px;flex:none;justify-content:center;padding:0}
.cont .cover .ct,.cont .cover .ca{display:none}.cont .cover .co{font-size:22px;opacity:.75}
.cont .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.cont .t{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25}
.cont .c{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.rows{display:flex;flex-direction:column}
.rowwrap{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;min-height:66px;padding:6px 0;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;min-width:0}
.rowwrap .row{border-bottom:none;flex:1}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3}
.row .s{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bar{margin-top:4px;height:3px}
.mini{width:40px;height:56px;flex:none;border-radius:3px 5px 5px 3px;color:#f6efe2;font-family:var(--serif);font-size:8.5px;line-height:1.1;display:flex;align-items:flex-end;padding:3px;overflow:hidden;overflow-wrap:anywhere;box-shadow:0 1px 2px var(--shadow)}
.lvl{font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;flex:none}
.lvl.easy{color:var(--easy);background:color-mix(in srgb,var(--easy) 14%,var(--card))}
.lvl.medium{color:var(--med);background:color-mix(in srgb,var(--med) 14%,var(--card))}
.lvl.hard{color:var(--hard);background:color-mix(in srgb,var(--hard) 13%,var(--card))}
.x{width:44px;height:44px;padding:0;border:none;background:none;color:var(--mute);display:grid;place-items:center;flex:none}
.cover{aspect-ratio:2/3;border-radius:4px 8px 8px 4px;position:relative;overflow:hidden;box-shadow:0 1px 2px var(--shadow),0 8px 18px var(--shadow);
  color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:12% 10% 10% 16%;font-family:var(--serif);container-type:inline-size}
.cover::before{content:"";position:absolute;left:5%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.18)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.16),transparent 40%,rgba(0,0,0,.18))}
.cover .ct{font-size:13cqw;font-weight:600;line-height:1.15;text-wrap:balance}
.cover .ca{font-size:8.5cqw;opacity:.85;font-style:italic}
.cover .co{font-size:11cqw;opacity:.6;text-align:center}

/* words */
.wcards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wcards button{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wcards .h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wcards .h b{font-family:var(--serif);font-size:20px;font-weight:600}
.wcards .h span{font-size:17px}
.wcards .ctx{font-family:var(--serif);font-size:14px;font-style:italic;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.wcards .src{font-size:13px;color:var(--mute)}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;font-size:17px;line-height:1.5}

/* settings */
.group h2{margin:0 0 2px 4px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
.group{display:flex;flex-direction:column;gap:6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:none;border-bottom:1px solid var(--line2);border-radius:0;background:none;font-size:17px;width:100%;text-align:left;position:relative}
.item:last-child{border-bottom:none}
.item > span:first-child{flex:1}
.item .v{color:var(--mute)}
.item select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);margin:0}
.offcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.offcard .st{display:flex;align-items:center;gap:10px;font-size:17px}
.offcard .st .icon{color:var(--ok)}
.offcard p{margin:0;font-size:15px;line-height:1.45;color:var(--ink2)}
.small{font-size:14px;line-height:1.5;color:var(--mute);padding:0 4px}

/* find */
.backbar{display:flex;align-items:center;margin:-12px 0 -8px -8px}
.back{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 8px;color:var(--accent);background:none;border:none;font-size:17px}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;background:var(--card);border:1px solid var(--field);border-radius:12px}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:17px;color:var(--ink);min-height:44px}
.search .icon{color:var(--mute)}
.frow{display:flex;align-items:center;gap:12px;min-height:66px;border-bottom:1px solid var(--line);padding:6px 0}
.frow .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.frow .t{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.frow .s{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .err{font-size:14px;color:var(--hard);white-space:normal}
.frow button{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);font-size:15px;font-weight:700;flex:none;white-space:nowrap}
.frow button.in{border-color:var(--line);color:var(--mute);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- reader ---------- */
#rhead{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 4px) 8px 4px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:transform .25s ease}
#rhead .sp{flex:1}
#rhead .lab{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:60px;min-height:44px;padding:0 4px;gap:2px;border:none;background:none;font-size:11px;font-weight:700;border-radius:10px}
#rhead .aa{font-family:var(--serif);font-size:19px;line-height:22px;font-weight:400}
#rhead.up,#rfoot.up{transform:translateY(-100%)}
#rfoot.up{transform:translateY(100%)}
#rfoot{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-between;padding:10px 22px calc(env(safe-area-inset-bottom) + 12px);font-size:13px;color:var(--mute);
  border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .25s ease}
#text{max-width:var(--mw);margin:0 auto;padding:calc(env(safe-area-inset-top) + 78px) 24px 30px;font-family:var(--font);font-size:var(--fs);line-height:var(--lh);text-align:var(--align);overflow-wrap:break-word;hyphens:var(--hy,manual);-webkit-hyphens:var(--hy,manual)}
#text p{margin:0 0 .85em}
#text h3{font-size:1.05em;font-weight:600;margin:1.6em 0 .8em;text-align:center;letter-spacing:.02em}
/* a first reader's lesson head: the lesson's new words, as a list (not a sentence) */
#text p.vocab{border:1px solid var(--line);border-radius:12px;padding:8px 14px 10px;text-align:left;line-height:1.7}
#text p.vocab::before{content:attr(data-k);display:block;font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);line-height:1.6}
#text p.vocab .sep{color:var(--mute)}
#text p.vocab:has(+ p.vocab){margin-bottom:0;border-bottom:none;border-radius:12px 12px 0 0;padding-bottom:0}
#text p.vocab + p.vocab{border-top:none;border-radius:0 0 12px 12px;padding-top:0}
#text p.vocab + p.vocab::before{content:none}
#text p.vocab:has(+ p.vocab) + p.vocab:has(+ p.vocab){border-radius:0}
#text p.vocab .resp{font-family:var(--ui);font-size:.75em;color:var(--mute)}
.opener{text-align:center;margin:6px 0 24px;display:flex;flex-direction:column;gap:6px}
.opener .k{font-family:var(--ui);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.opener h1{font-family:var(--font);font-weight:600;font-size:1.3em;line-height:1.25;margin:0;text-wrap:balance}
.tip{display:flex;align-items:center;gap:10px;background:var(--tip);border:1px solid var(--tipline);border-radius:12px;padding:10px 12px;margin:0 0 20px;font-family:var(--ui);font-size:16px;line-height:1.35;text-align:left}
.tip span{flex:1}.tip small{font-size:13px;color:var(--mute)}
.tip .icon{color:var(--accent)}
.w{cursor:pointer;border-radius:4px;transition:background .15s}
.w.on{background:var(--hl);box-shadow:0 0 0 3px var(--hl)}
.w.saved{text-decoration:underline 1.5px dotted var(--accent);text-underline-offset:5px}
#chapnav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;max-width:var(--mw);margin:0 auto;padding:10px 24px calc(env(safe-area-inset-bottom) + 90px)}
#chapnav button{text-align:left;padding:12px 14px;border-radius:14px;min-width:0}
#chapnav button small{display:block;color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
#chapnav button span{display:block;font-family:var(--serif);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chapnav #next{text-align:right;grid-column:2}

/* ---------- sheets ---------- */
#scrim{position:fixed;inset:0;z-index:19;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#scrim.on{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;
  box-shadow:0 -8px 30px var(--shadow);padding:0 20px calc(env(safe-area-inset-bottom) + 26px);max-height:62vh;overflow:auto;overscroll-behavior:contain;
  transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;display:flex;flex-direction:column;gap:14px}
.sheet > *{flex-shrink:0}
.sheet.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px)}
.sheet.word.expanded{max-height:86vh}
.sheet.look{max-height:78vh}
.sh-head{position:sticky;top:0;z-index:2;background:var(--card);display:flex;flex-direction:column;gap:6px;padding-top:8px;margin:0 -20px;padding-left:20px;padding-right:20px;padding-bottom:4px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--grab);margin:0 auto 4px}
.sh-row{display:flex;align-items:center;gap:10px}
.sh-row h2{flex:1;margin:0;font-size:22px;font-weight:700}
.sh-row h2.serif{font-family:var(--serif);font-size:26px;font-weight:600}
.wd{flex:1;min-width:0;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.say{width:48px;height:48px;border-radius:24px;border:none;background:var(--soft);color:var(--accent);display:grid;place-items:center;padding:0;flex:none}
.best{font-family:var(--serif);font-size:30px;line-height:1.2;overflow-wrap:anywhere}
.best.wait{color:var(--mute)}
.phr{display:flex;flex-direction:column;gap:2px}
.phr small{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.phr b{font-family:var(--serif);font-size:20px;font-weight:600}
.alone{font-size:17px;line-height:1.45}
.alone b{font-family:var(--serif);font-weight:600}
.gram{font-size:17px;line-height:1.45;color:var(--ink2)}
.gram b{font-weight:700}
.gram .det{display:block;font-size:15px;color:var(--mute);margin-top:2px}
.calm{font-size:17px;line-height:1.5;color:var(--ink2);margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two button{min-height:46px;border-radius:12px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px}
.saved-on{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}

.more{display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:16px;font-weight:700;border:none;border-top:1px solid var(--line2);border-radius:0;background:none;color:var(--accent);padding:0;width:100%}

.defs h4{margin:14px 0 2px;font-family:var(--serif);font-size:18px;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}

.defs ol{margin:6px 0 4px;padding-left:22px;line-height:1.5;font-size:16px}

/* contents */

.toc .at{font-size:13px;font-weight:700;color:var(--accent);flex:none}
.before{display:flex;align-items:center;gap:10px;min-height:52px;border:none;background:none;color:var(--ink2);font-size:16px;padding:0;text-align:left;width:100%}

/* look */

.themes button[aria-pressed=true]{border:2.5px solid var(--accent)!important;font-weight:700;box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;line-height:1.3}

.fonts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fonts button{min-height:52px;border-radius:12px;font-size:17px;padding:4px;background:var(--card)}
.fonts button[aria-pressed=true],.seg button[aria-pressed=true]{border:2.5px solid var(--accent);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}

/* add-book help */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}

/* ---------- learn ---------- */
.sub{margin:-16px 0 0;font-size:16px;line-height:1.45;color:var(--mute)}

.rvcard .ln{font-size:15px;line-height:1.4;opacity:.92;margin-top:2px}
.rvcard.calm{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.rvcard.calm .ln{color:var(--mute);opacity:1}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lcard .top{display:flex;align-items:center;gap:12px}
.lcard .ic{width:40px;height:40px;border-radius:20px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.lcard .tt{font-family:var(--serif);font-size:19px;font-weight:600}
.lcard .ds{font-size:14px;color:var(--mute);line-height:1.4}
.lcard .box{font-size:15px;line-height:1.5;background:var(--bg);border-radius:10px;padding:8px 10px}
.dark{min-height:48px;border-radius:24px;background:var(--ink);color:var(--bg);border:none;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;padding:0 16px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gtiles button{min-height:64px;text-align:left;border-radius:14px;padding:10px 12px;font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.gtiles small{font-weight:400;font-size:13px;color:var(--mute)}
/* review + quiz */
.stage{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.rtop{display:flex;align-items:center;gap:8px;margin:0 -8px}

.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rtop .cnt{font-size:14px;color:var(--mute);padding:0 8px;white-space:nowrap}
.rmain{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:16px}
.from{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);min-width:0}

.fcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}

.fcard .mean{font-size:22px;line-height:1.35;overflow-wrap:anywhere}
.fcard .q{font-size:15px;color:var(--mute)}
.fcard .hint{font-size:16px;color:var(--ink2)}

.fcard .ensent{font-size:16px;line-height:1.45;color:var(--mute)}
.fcard .fb{border-top:1px dashed var(--line);padding-top:12px;font-size:16px;line-height:1.5}
.fcard .fb .ok{color:var(--ok);font-weight:700}.fcard .fb .no{color:var(--hard);font-weight:700}
.hit{background:color-mix(in srgb,var(--ok) 20%,var(--card));color:var(--ink);border-radius:6px;padding:0 3px;font-weight:600}
.gap{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--accent);margin:0 2px;color:transparent}
.hear{align-self:flex-start;min-height:44px;padding:0 16px;border-radius:22px;background:var(--bg);font-size:15px;display:inline-flex;align-items:center;gap:6px}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts button{min-height:52px;font-size:17px;font-family:var(--serif);overflow-wrap:anywhere;text-align:center;padding:8px}
.opts.eng button{font-family:var(--ui);font-size:16px}
.opts button:disabled{opacity:1;color:var(--mute);border-color:var(--line2)}
.opts button.right{border:2px solid var(--ok);color:var(--ok);font-weight:700}
.opts button.wrong{border:2px solid var(--hard);color:var(--hard)}
.rfoot{display:flex;flex-direction:column;gap:10px;padding-top:16px}
.rfoot .askg{font-size:14px;color:var(--mute);text-align:center}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades button{height:60px;padding:0 2px;border-radius:14px;border:1px solid var(--grab);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.grades button small{font-weight:400;font-size:12px;color:var(--mute)}
.grades .again{color:var(--hard)}.grades .hard{color:var(--med)}
.grades .good{background:var(--ok);border-color:var(--ok);color:var(--card)}.grades .good small{color:var(--card);opacity:.9}
.lnks{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lnks a{min-height:44px;display:flex;align-items:center;font-size:15px;font-weight:700}
.lnks .wrongb{min-height:44px;border:none;background:none;color:var(--mute);font-size:15px;text-decoration:underline;padding:0 4px}
.done{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding-top:24px}

.field{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700}
.field textarea{font:inherit;font-weight:400;font-size:16px;min-height:80px;border:1px solid var(--field);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}
/* words: progress + filters + strength */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stats b{display:block;font-family:var(--serif);font-size:24px;font-weight:600}
.stats span{display:block;font-size:13px;line-height:1.3;color:var(--mute)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--grab);background:var(--card);font-size:15px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.wcards .h{flex-wrap:nowrap}
.wcards .h .wt{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.str{flex:none;width:48px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;align-self:center}
.str i{display:block;height:100%;background:var(--ok);border-radius:3px}
/* messages */
.soon{background:var(--tip);border:1px solid var(--tipline);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.soon b{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
.soon p{margin:0;font-size:16px;line-height:1.5}
#tabs button{position:relative}
#tabs button.dot::after{content:"";position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:5px;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.view.chatv{gap:12px;padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:calc(var(--tabh) + 92px)}
body.typing .view.chatv{padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}
.chead{display:flex;align-items:center;gap:12px;padding:8px 0 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -20px;padding-left:20px;padding-right:20px}
.chead .av{width:44px;height:44px;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.chead .who{flex:1;min-width:0}
.chead h1{font-size:20px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .lv{font-size:13px;color:var(--mute)}
.cchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cchip{min-height:36px;display:inline-flex;align-items:center;padding:0 12px;border-radius:18px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--mute)}
button.cchip{min-height:44px}
.cchip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cchip.sug{background:var(--soft);color:var(--ink);border-color:var(--soft)}
.cany{font-size:13px;color:var(--mute)}
.cbanner{background:var(--tip);border:1px solid var(--tipline);border-radius:12px;padding:8px 12px;font-size:14px}
.msgs{display:flex;flex-direction:column;gap:14px}
.msg{max-width:84%;border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;min-width:0}
.msg.theirs{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.mine{align-self:flex-end;background:var(--soft);border-bottom-right-radius:4px}
.msg .mo{font-family:var(--serif);font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.msg .mt{font-size:15px;line-height:1.45;color:var(--ink2);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.msg.mine .mt{border-top-color:var(--grab)}
.msg .mt.wait{color:var(--mute);font-style:italic}
.msg .w.saved{text-underline-offset:4px}
.mm{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-top:4px;font-size:12px;color:var(--mute)}
.mm .okc{color:var(--ok);font-weight:700}
.mlink{min-height:32px;padding:0;border:none;background:none;color:var(--mute);font-size:12px;text-decoration:underline}
.mlink[data-sure="1"]{color:var(--hard);font-weight:700}
.cempty{margin:24px 0;font-size:17px;line-height:1.5;color:var(--ink2);text-align:center}
.ctap{text-align:center;margin:0}
.composer{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 67px);z-index:14;display:flex;gap:8px;align-items:flex-end;padding:8px 12px;
  border-top:1px solid var(--line);background:var(--card);max-width:720px;margin:0 auto}
body.typing #tabs{display:none}
body.typing .composer{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
.helpme{min-height:44px;padding:0 12px;border:1px solid var(--tipline);border-radius:22px;background:var(--tip);font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.cin{flex:1;min-width:0;display:flex}
.cin textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cin textarea{width:100%;min-height:44px;max-height:140px;resize:none;border:1px solid var(--field);border-radius:22px;padding:11px 14px;font:inherit;font-size:16px;line-height:1.3;background:var(--bg);color:var(--ink);display:block}
.csend{width:44px;height:44px;border:none;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0;flex:none}
.csend.busy{opacity:.55}
.csend .icon{width:20px;height:20px}
/* word card actions + go deeper */
.wact{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.tipbtn{min-height:48px;border:1px solid var(--tipline);border-radius:24px;background:var(--tip);color:var(--ink);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 16px}
.tipbtn.wide{width:100%}
.wrongb{min-height:44px;border:none;background:none;color:var(--mute);font-size:14px;text-decoration:underline;padding:0 4px}
.kicker+.best{margin-top:-8px}
.field input{font:inherit;font-weight:400;font-size:17px;min-height:48px;border:1px solid var(--field);border-radius:12px;padding:0 14px;background:var(--bg);color:var(--ink)}
.seebox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:10px;font-size:14px;line-height:1.4}
.srow .k{flex:none;width:84px;color:var(--mute)}
.srow .v{min-width:0;overflow-wrap:anywhere}
.seebox .link{align-self:flex-start;font-size:14px;text-decoration:underline;padding:0}
a.primary{text-decoration:none}
/* check before sending */
.ccard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.cmsg{font-family:var(--serif);font-size:18px;line-height:1.55;margin-top:6px;overflow-wrap:anywhere}
.cmsg s{color:var(--hard);text-decoration-thickness:2px}
.cmsg ins{text-decoration:none;background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ink);border-radius:4px;padding:0 4px;font-weight:600}
.fixes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.fixes li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}

.htext{font-family:var(--serif);font-size:18px;line-height:1.45;overflow-wrap:anywhere}
.htr{font-size:14px;color:var(--mute)}
.hparts{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.hp{display:flex;gap:10px;align-items:baseline;font-size:14px;line-height:1.45}

.hcard .two button{font-size:14px;font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:15px;z-index:40;box-shadow:0 6px 20px var(--shadow);max-width:90vw;text-align:center}
/* ---------- grammar you can see (part 2b) ---------- */
/* The three kinds of change a verb form can carry. Each colour passes 4.5:1 on its theme's card and
   page, and the three sit at least 10.9 CIELAB lightness steps apart, so they read apart without relying on hue;
   the underline style is a third cue (solid, dotted, dashed). */
:root,:root[data-theme=light]{--irr:#9e2017;--stem:#b15200;--spell:#1e3277;--tl-stretch:#9a4420;--tl-point:#1f5f9e;--tl-band:#f7e1b5}
:root[data-theme=sepia]{--irr:#8e1c14;--stem:#a04b00;--spell:#1a2c67;--tl-stretch:#8a3d1b;--tl-point:#1c5590;--tl-band:#ecd08f}
:root[data-theme=dark],:root[data-theme=black]{--irr:#ff6656;--stem:#f6ac4d;--spell:#cadeff;--tl-stretch:#e8955f;--tl-point:#8cc0f2;--tl-band:#5b4524}
.sl{font-weight:700;text-decoration-line:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-skip-ink:none}

.sl.stem{color:var(--stem);text-decoration-style:dotted}
.sl.spell{color:var(--spell);text-decoration-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink2);align-items:baseline}
.legend > span{display:inline-flex;gap:6px;align-items:baseline}
.legend .sl{font-family:var(--serif);font-size:17px}
.gtiles button.wide{grid-column:1 / -1}

.grh{display:flex;flex-direction:column;gap:6px}
.sub2{margin:0;font-size:16px;line-height:1.5;color:var(--mute)}

.vsearch{display:flex;gap:8px}
.vsearch .search{flex:1;min-width:0}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-family:var(--serif);font-size:17px;display:inline-flex;align-items:center;gap:8px}
.vchip[aria-pressed=true]{border:2px solid var(--accent);font-weight:600}
.kd{width:9px;height:9px;border-radius:50%;flex:none;background:var(--grab)}
.kd.irr{background:var(--irr)}.kd.stem{background:var(--stem)}.kd.spell{background:var(--spell)}

.vhead{display:flex;align-items:flex-start;gap:10px}
.vhead .vt{flex:1;min-width:0}
.vhead h2{margin:0;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.vhead .gl{font-size:17px;color:var(--ink2);margin-top:2px;min-height:1.3em}

.kbs{display:flex;flex-wrap:wrap;gap:6px}
.kb{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--ink2);background:var(--bg)}

.nonfin{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--mute)}
.nonfin .fm{font-family:var(--serif);font-size:18px;color:var(--ink)}
.gh{margin:6px 0 -4px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
.gh span{font-weight:400;text-transform:none;letter-spacing:0}
.tz{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tz > summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;cursor:pointer}
.tz > summary::-webkit-details-marker{display:none}
.tz > summary .tn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tz > summary .tn b{font-size:17px}
.tz > summary .tn span{font-size:14px;color:var(--mute);line-height:1.35}
.tz > summary .icon{color:var(--mute);transition:transform .2s}
.tz[open] > summary .icon{transform:rotate(90deg)}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:16px;border-radius:2px;background:var(--line)}
.dots i.irr{background:var(--irr)}.dots i.stem{background:var(--stem)}.dots i.spell{background:var(--spell)}
.rows2{display:flex;flex-direction:column;border-top:1px solid var(--line2)}
.cf{display:flex;align-items:baseline;gap:10px;min-height:48px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line2);border-radius:0;background:none;padding:8px 14px}
.cf:last-child{border-bottom:none}
.cf .pp{width:38%;flex:none;font-size:14px;color:var(--mute);line-height:1.3}
.cf .fm{flex:1;min-width:0;font-family:var(--serif);font-size:20px;line-height:1.3;overflow-wrap:anywhere}

.cf.none .fm{color:var(--mute)}

/* tense timeline */

.tlhead span{position:absolute;top:0;white-space:nowrap}
.track{position:relative;height:104px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.track .axis{position:absolute;left:0;right:8px;top:62px;height:2px;background:var(--ink)}

.track.drag .thumb{transition:none}
.tlw{position:absolute;top:0;transform:translateX(-50%);min-width:48px;min-height:44px;padding:0 8px;border-radius:22px;border:1px solid transparent;background:none;font-family:var(--serif);font-size:20px;font-weight:600}

.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

<script>
'use strict';
// The free-book relay (a Cloudflare Worker that fetches EPUBs from gutenberg.org only).
const BOOKS_PROXY = 'https://lector-books.brianfliesballoons.workers.dev';

const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('lector.'+k); return v==null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem('lector.'+k, JSON.stringify(v)) }catch(e){} if (LS.onset) LS.onset(k) },
  onset: null   // the profile sync listens here (set further down, once it exists)
};
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = (id, cls = '') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const fold = w => w.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/[^a-z]/g, '');
const foldText = s => String(s).toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
// Where wording differs by phone: saving a file, adding a voice. Everything else is the same web app.
const PLATFORM = /Android/i.test(navigator.userAgent) ? 'android'
  : /iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1) ? 'ios' : 'other';

// What a passkey is called on this phone: Face ID / Touch ID on Apple, the fingerprint or screen lock on Android
// (no Face ID there), a plain "passkey" on a computer.
const PKW = {
  ios: {en: {n: 'Face ID / Touch ID', or: 'Face ID or Touch ID', label: 'Face ID / Touch ID', item: 'Face ID / Touch ID (passkey)'},
    es: {n: 'Face ID / Touch ID', or: 'Face ID o Touch ID', label: 'Face ID / Touch ID', item: 'Face ID / Touch ID (llave de acceso)'}},
  android: {en: {n: 'fingerprint or screen lock', or: 'your fingerprint or screen lock', label: 'Fingerprint or screen lock', item: 'Fingerprint or screen lock (passkey)'},
    es: {n: 'huella o bloqueo de pantalla', or: 'tu huella o el bloqueo de pantalla', label: 'Huella o bloqueo de pantalla', item: 'Huella o bloqueo de pantalla (llave de acceso)'}},
  other: {en: {n: 'a passkey', or: 'a passkey', label: 'Passkey', item: 'Passkey'},
    es: {n: 'una llave de acceso', or: 'una llave de acceso', label: 'Llave de acceso', item: 'Llave de acceso'}}
}[PLATFORM];

/* ---------- settings ---------- */
const FONTS = {
  literata:["Literata","'Literata',Georgia,serif"], lora:["Lora","'Lora',Georgia,serif"], atkinson:["Easy read","'Atkinson Hyperlegible',system-ui,sans-serif"],
  garamond:["Garamond","'EB Garamond',Garamond,serif"], georgia:["Georgia","Georgia,'Times New Roman',serif"], newyork:["New York","ui-serif,'New York','Iowan Old Style',serif"]
};
const MAIN_FONTS = ['literata','lora','atkinson'];
const THEMES = {light:['Paper','#faf7f2','#1f1c17','#e7e0d4'], sepia:['Sepia','#f3e7d0','#3b2f22','#e0cfae'], dark:['Dark','#1a1917','#e8e2d6','#34312b'], black:['Black','#000000','#d8d2c6','#222222']};
// lang: the language being learned (Settings › Learning). Spanish unless chosen otherwise.
const settings = Object.assign({fs:20, font:'literata', lh:1.7, mw:36, align:'left', theme:'light', match:true, voice:'auto', voice_fr:'auto', voice_en:'auto', ui:'auto', rate:0.9, slow:0.6, speakTap:true, lang:'es', reviewCap:15}, LS.get('settings', {}));
const LANGS = {es:'Spanish', fr:'French', en:'English'};
// First run on a phone set to Spanish: the app speaks Spanish and the books are English (a Spanish speaker
// learning English, like María Antonieta). Both can be changed in Settings.
try { if (localStorage.getItem('lector.settings') == null && /^es\b/i.test(navigator.language || '')){ settings.ui = 'es'; settings.lang = 'en' } } catch(e){}   // English is offered to a Spanish speaker (María Antonieta's side)
const langOf = code => { const c = String(code || '').trim().toLowerCase().slice(0, 2); return LANGS[c] ? c : '' };
if (!LANGS[settings.lang]) settings.lang = 'es';
const bookLang = b => (b && langOf(b.lang)) || 'es';   // books stored before French arrived are Spanish
if (settings.theme === 'auto' || !THEMES[settings.theme]){ settings.match = settings.theme === 'auto' ? true : settings.match; settings.theme = 'light' }   // the old "Auto" swatch
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const effTheme = () => settings.match ? (darkMQ.matches ? 'dark' : 'light') : settings.theme;
function applySettings(){
  const r = document.documentElement.style;
  r.setProperty('--fs', settings.fs + 'px');
  r.setProperty('--lh', settings.lh);
  r.setProperty('--mw', settings.mw + 'em');
  r.setProperty('--font', (FONTS[settings.font] || FONTS.literata)[1]);
  r.setProperty('--align', settings.align);
  r.setProperty('--hy', settings.align === 'justify' ? 'auto' : 'manual');
  document.documentElement.dataset.theme = effTheme();
  requestAnimationFrame(() => $('meta[name=theme-color]').content = getComputedStyle(document.body).backgroundColor);
  LS.set('settings', settings);
}
applySettings();
darkMQ.addEventListener && darkMQ.addEventListener('change', () => { if (settings.match) applySettings() });
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hide'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.add('hide'),2600) }

/* ---------- storage (IndexedDB for book texts) ---------- */
const DB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('lector', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('books', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('books', mode), s = t.objectStore('books'), q = fn(s);
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  })};
  return { get:id => tx('readonly', s => s.get(id)), put:b => tx('readwrite', s => s.put(b)),
           del:id => tx('readwrite', s => s.delete(id)), all:() => tx('readonly', s => s.getAll()), keys:() => tx('readonly', s => s.getAllKeys()) };
})();

/* ---------- EPUB -> {title, author, chapters:[{title, paras}]} ---------- */
const BLOCK = 'p,h1,h2,h3,h4,h5,h6,li,div,blockquote,pre,dd,dt,td';
// Files that are never story text. Matched on the file name only: Gutenberg's "pg-header"
// item also holds the opening chapters, so its header is removed element by element below.
const SKIP_FILE = /wrap0000|cover|(^|\/)toc\.|(^|\/)nav\.|(^|\/)(about|title)\.x?html/i;
const JUNK = 'script,style,img,sup.noteref,a.pginternal sup,#pg-header,#pg-footer,.pg-boilerplate,section[id^="pg-"],' +
  'a[rel~="mw:WikiLink/Interwiki"],.pagenum,.x-ebookmaker-pageno,span[id^="img_"],.mw-cite-backlink,.cite-bracket,sup.reference,.reference,.reflist,.mw-editsection,' +
  '[style*="display:none"],[style*="display: none"],figure';
const HEAD = 'h1,h2,h3,h4,h5,h6';
// Bump when the parser changes how a book splits into chapters: bundled books stored on the
// phone are then parsed again (their reading place is carried across by its text).
const PARSER = 2;
const normPath = p => { const out = []; for (const s of p.split('/')){ if (s === '..') out.pop(); else if (s && s !== '.') out.push(s) } return out.join('/') };
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
// The book's own table of contents, as {file path: [{label, frag}]}. EPUB 3 nav first, then EPUB 2 NCX.
async function tocLabels(zip, opf, base){
  const map = {}, add = (from, href, label) => {
    if (!href || /^[a-z]+:/i.test(href)) return;
    const [file, frag] = href.split('#'), k = normPath(dirOf(from) + decodeURIComponent(file)); label = (label || '').replace(/\s+/g, ' ').trim();
    if (!k || !label) return;
    (map[k] = map[k] || []).push({label, frag: frag ? decodeURIComponent(frag) : ''});
  };
  try {
    const nav = opf.querySelector('manifest > item[properties~="nav"]');
    if (nav){
      const p = normPath(base + decodeURIComponent(nav.getAttribute('href'))), f = zip.file(p);
      if (f){ const d = new DOMParser().parseFromString(await f.async('text'), 'text/html');
        const n = [...d.querySelectorAll('nav')].find(x => /toc/.test(x.getAttribute('epub:type') || x.getAttribute('role') || '')) || d.querySelector('nav');
        if (n) for (const a of n.querySelectorAll('a[href]')) add(p, a.getAttribute('href'), a.textContent) }
    }
    if (!Object.keys(map).length){
      const tid = opf.querySelector('spine') && opf.querySelector('spine').getAttribute('toc');
      const nx = (tid && [...opf.querySelectorAll('manifest > item')].find(x => x.getAttribute('id') === tid)) || opf.querySelector('manifest > item[media-type="application/x-dtbncx+xml"]');
      if (nx){ const p = normPath(base + decodeURIComponent(nx.getAttribute('href'))), f = zip.file(p);
        if (f){ const d = new DOMParser().parseFromString(await f.async('text'), 'application/xml');
          for (const np of d.getElementsByTagNameNS('*', 'navPoint')){
            const c = np.getElementsByTagNameNS('*', 'content')[0], t = np.getElementsByTagNameNS('*', 'text')[0];
            if (c && t) add(p, c.getAttribute('src'), t.textContent) } } }
    }
  } catch(e){}
  return map;
}
// lang: the book's own language from its dc:language, else `fallback` (the language being learned).
async function parseEpub(buf, fallback){
  const zip = await JSZip.loadAsync(buf);
  const xml = async p => new DOMParser().parseFromString(await zip.file(p).async('text'), 'application/xml');
  const cont = await xml('META-INF/container.xml');
  const opfPath = cont.querySelector('rootfile').getAttribute('full-path');
  const base = dirOf(opfPath);
  const opf = await xml(opfPath);
  const meta = n => { const e = opf.getElementsByTagNameNS('*', n)[0]; return e ? e.textContent.trim() : '' };
  const lang = langOf(meta('language')) || langOf(fallback) || settings.lang;
  const items = {}; for (const it of opf.querySelectorAll('manifest > item')) items[it.getAttribute('id')] = it.getAttribute('href');
  const toc = await tocLabels(zip, opf, base);
  const chapters = []; let done = false, cur = null;
  const open = title => { cur = {title, paras: []}; chapters.push(cur) };
  for (const ref of opf.querySelectorAll('spine > itemref')){
    if (done) break;
    const id = ref.getAttribute('idref'), href = items[id];
    if (!href || SKIP_FILE.test(href)) continue;
    const path = normPath(base + decodeURIComponent(href.split('#')[0])), f = zip.file(path); if (!f) continue;
    const doc = new DOMParser().parseFromString(await f.async('text'), 'text/html');
    doc.querySelectorAll(JUNK).forEach(e => e.remove());
    let fresh = true;
    for (const el of doc.body.querySelectorAll(BLOCK)){
      const inHead = el.closest(HEAD);

// The phone's own voices for the language: Spanish voices for a Spanish book, French for a French one.
let allVoices = [];

const vlang = v => String(v.lang || '').replace(/_/g, '-').toLowerCase();
const voicesFor = code => allVoices.filter(v => vlang(v).split('-')[0] === code);
const loadVoices = () => { const n = allVoices.length; allVoices = speechSynthesis.getVoices() || []; return allVoices.length !== n };
if ('speechSynthesis' in window){
  loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (view === 'settings') renderSettings() };
  // Chrome on Android can fill the list late without firing the event: look again a few times.
  [300, 1200, 3000, 8000].forEach(t => setTimeout(() => { if (loadVoices() && view === 'settings') renderSettings() }, t));
}
const NO_VOICE = name => (T.set.noVoice[PLATFORM] || T.set.noVoice.other)(name);
// English words (in Messages, and English cards for a Spanish speaker) use an American English voice.
const EN_VOICE = {code:'en', voiceKey:'voice_en', voiceRe:/en[-_]US/i, voiceDefault:'en-US'};
function speak(text, slow, code){
  if (!('speechSynthesis' in window)) return toast(T.lib.noSpeech);
  speechSynthesis.cancel();
  if (!allVoices.length) loadVoices();

  const p = LS.get('progress', {})[id]; if (!p || !p.n) return 0;

async function addFree(id){

    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);
    const r = await fetch(BOOKS_PROXY + '/epub/' + id, {signal: ctl.signal});
    if (!r.ok) throw new Error('status ' + r.status);
    const total = +r.headers.get('content-length') || 0, parts = []; let got = 0;
    if (r.body && r.body.getReader){
      const rd = r.body.getReader();
      for (;;){ const {done, value} = await rd.read(); if (done) break; parts.push(value); got += value.length;

function carryPlace(id, old, nb){

// A first reader (manifest "drills": McGuffey) opens each lesson with its new words, "dog   the   ran", and a

// The letter row is for a teacher and is left out; the word row is shown as a list, so it never reads as a

function lessonHead(paras){

  const s = e.target.closest('#text .w');
  if (!s){ if ($('#sheet').classList.contains('open')) closeSheet(); else showChrome(); return }
  if (!LS.get('tipDone')){ LS.set('tipDone', 1); const t = $('#text .tip'); if (t) t.remove() }
  document.querySelectorAll('.w.on').forEach(x => x.classList.remove('on')); s.classList.add('on');
  const p = s.closest('[data-p]');
  showWord(s.textContent, sentenceAround(s), s, {bookId:book.id, title:book.title, c:chap, p:p ? +p.dataset.p : 0, ct:book.chapters[chap].title, tr:book.tr, live:true, lang:bookLang(book)});
});

// Jump to a saved word's sentence: by its stored place, else by finding the sentence.
async function jumpInBook(t){
  let c = t.c, p = t.p;
  const has = (ci, pi) => book.chapters[ci] && book.chapters[ci].paras[pi] != null && (!t.sentence || sentKey(book.chapters[ci].paras[pi]).includes(sentKey(t.sentence)));
  if (c == null || !has(c, p)){
    c = null;
    const k = t.sentence && sentKey(t.sentence);
    if (k) outer: for (let ci = 0; ci < book.chapters.length; ci++) for (let pi = 0; pi < book.chapters[ci].paras.length; pi++)
      if (sentKey(book.chapters[ci].paras[pi]).includes(k)){ c = ci; p = pi; break outer }
  }
  if (c == null){ showChapter(book.start || 0, 0); return toast(T.lib.noSentence) }
  showChapter(c, p);
  const el = $(`#text [data-p="${p}"]`); if (!el) return;
  requestAnimationFrame(() => {
    window.scrollTo(0, el.getBoundingClientRect().top + scrollY - Math.max(90, innerHeight / 3));
    const lk = PACK[bookLang(book)].key, hits = [...el.querySelectorAll('.w')].filter(x => lk(x.textContent) === t.word);
    hits.forEach(x => x.classList.add('on')); setTimeout(() => hits.forEach(x => x.classList.remove('on')), 2500);
  });
}

// One sentence splitter for everything: the reader, the word card, and the Mac-side
// translation tool (translate_book.py runs this same function), so a sentence
// tapped here is byte-for-byte the key its translation was stored under.
function splitSentences(text){
  const out = [], re = /[.!?…]+[»”"’')\]]*(?=\s|$)/g; let start = 0, m;
  while ((m = re.exec(text))){
    const end = m.index + m[0].length, s = text.slice(start, end).trim();
    if (s) out.push({s, a:start, b:end}); start = end;
  }
  const tail = text.slice(start).trim(); if (tail) out.push({s:tail, a:start, b:text.length});
  return out;
}
const sentKey = s => s.replace(/\s+/g, ' ').trim();
function sentenceAround(span){
  const p = span.parentElement, full = p.textContent;
  let off = 0; for (const n of p.childNodes){ if (n === span) break; off += n.textContent.length }
  const hit = splitSentences(full).find(x => off >= x.a && off < x.b);
  return hit ? hit.s : full.trim();
}

/* ---------- sheets ---------- */
let sheetSpan = null;
function head(title, closeLabel){
  return `<div class="sh-head"><div class="grab" aria-hidden="true"></div><div class="sh-row">${title}<button class="pill" data-close>${closeLabel}</button></div></div>`;
}
function openSheet(html, kind, label){
  const sh = $('#sheet'); sh.innerHTML = html; sh.className = 'sheet open ' + (kind || '');
  sh.setAttribute('aria-label', label || ''); sh.scrollTop = 0;
  $('#scrim').classList.toggle('on', kind === 'tall');
  sh.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
  return sh;
}
function closeSheet(){
  const sh = $('#sheet'); sh.classList.remove('open'); $('#scrim').classList.remove('on');
  const cl = $('#cnLink'); if (cl) cl.remove();   // a Claude connector link is shown once; it never stays in a closed sheet
  document.querySelectorAll('.w.on').forEach(x => x.classList.remove('on'));
  document.body.style.paddingBottom = ''; sheetSpan = null;
}
$('#scrim').onclick = closeSheet;
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet() });
// Keep the tapped word visible above the card.
function reveal(){
  const sh = $('#sheet'), s = sheetSpan; if (!s || !sh.classList.contains('open')) return;
  const h = sh.offsetHeight; document.body.style.paddingBottom = h + 'px';
  const r = s.getBoundingClientRect(), limit = innerHeight - h - 24, top = view === 'reader' ? 80 : 20;
  if (r.bottom > limit) window.scrollBy(0, Math.min(r.bottom - limit, r.top - top));
  else if (r.top < top) window.scrollBy(0, r.top - top);
}
// drag the sheet down to dismiss
(() => {
  let y0 = null; const sh = $('#sheet');
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 != null){ const d = e.touches[0].clientY - y0; if (d > 0) sh.style.transform = `translateY(${d}px)` } }, {passive:true});
  sh.addEventListener('touchend', e => { if (y0 != null){ const d = e.changedTouches[0].clientY - y0; sh.style.transform = ''; if (d > 90) closeSheet() } y0 = null });
})();

/* ---------- English for a sentence ---------- */
// Pre-translated sentences ship inside the book. Anything missing is asked of the Mac's own
// model through the tailnet (works only while the Mac is on), then kept with the book.
const LIVE = 'https://brians-macbook-pro.tail72e310.ts.net/lector/translate';
async function englishFor(sentence, ctx){
  const k = sentKey(sentence);
  if (ctx.tr && ctx.tr[k]) return ctx.tr[k];
  if (!ctx.live || !book || book.id !== ctx.bookId || !navigator.onLine) return null;
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 25000);
    const r = await fetch(LIVE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:k}), signal:ctl.signal});
    clearTimeout(t); if (!r.ok) return null;
    const en = (await r.json()).en; if (!en) return null;
    book.tr = book.tr || {}; book.tr[k] = en; DB.put(book);
    return en;
  } catch(e){ return null }
}

/* ---------- phrases: the tapped word with its neighbours ---------- */
// The dictionary holds ~21,500 multi-word entries ("sin embargo", "pompas fúnebres", "por fin").
// Try every 2-4 word window that contains the tapped word, longest first, words joined only by
// spaces (never across punctuation). A window of nothing but little words ("de la") is skipped.
const LITTLE = new Set('de la el los las lo que a en y o u e un una unos unas por con se su sus del al no es le les me te nos os mi tu ni más mas como pero sin para ya si sí este esta ese esa'.split(' '));
// Only kinds of phrase that mean the same wherever they appear. Adjective, interjection and
// pronoun entries ("de hierro" = strong, "mi alma" = friend) are too often literal in a story.
const AUX = new Set('es era eras éramos eran son fue fueron sea sean está están estaba estaban ha han había habían hay será sería'.split(' '));
const ARTICLE = /^(el|la|los|las|un|una|unos|unas|mi|tu|su|mis|tus|sus|lo|como)$/;
// French: the same idea with French little words. "il y a" is all little words, so it and its
// tenses are listed by hand; "au lieu d'aller" is tried as "au lieu de" and "qu'il y a" as "il y a".
const LITTLE_FR = new Set("de d' la le les l' du des un une et ou à au aux en y que qui qu' ne n' pas se s' sa son ses ce c' cet cette ces il elle ils elles on je j' tu nous vous me m' te t' lui leur leurs mon ma mes ton ta tes notre nos votre vos est a dans par pour sur avec mais si plus comme".split(' '));
const AUX_FR = new Set(Object.keys(FR_AUXOF));
const ARTICLE_FR = /^(le|la|les|l'|un|une|des|du|mon|ma|mes|ton|ta|tes|son|sa|ses|notre|nos|votre|vos|leur|leurs|ce|cet|cette|ces|comme)$/;
const FIXED_FR = {'il y a':'there is, there are', 'il y avait':'there was, there were', 'il y eut':'there was', 'il y aura':'there will be', 'il y aurait':'there would be',
  "il n'y a":'there is no', "il n'y avait":'there was no', "il n'y a pas":'there is no', "il n'y avait pas":'there was no', "il n'y eut":'there was no',
  'tout le monde':'everyone', 'quelque chose':'something', "n'importe quoi":'anything', "n'importe qui":'anyone', "n'importe où":'anywhere'};
async function phraseOk(words, pos){
  const [first] = words, last = words[words.length - 1];
  if (/^(conj|prep_phrase)$/.test(pos)) return true;
  if (pos === 'verb') return !P.little.has(last);
  if (pos === 'adv') return !P.article.test(first);
  if (pos === 'prep'){
    if (words.length > 2) return true;
    const r = await exact(first);   // "encima de" yes; "cosa de", "favor de" no
    return !!(r && r.d && r.d.some(e => /^(adv|prep)$/.test(e[0])));
  }
  if (pos === 'noun') return !P.aux.has(first) && words.every((w, i) => !P.little.has(w) || (P.inner.has(w) && i > 0 && i < words.length - 1));
  return false;
}
async function phraseAround(span){
  if (!span || !span.parentElement) return null;
  const fr = P.code === 'fr', ws = []; let sep = null;
  for (const n of span.parentElement.childNodes){
    if (n.nodeType === 1 && n.classList.contains('w')){ const raw = n.textContent; ws.push({el:n, t: fr ? (raw === 'A' ? 'à' : P.norm(raw)) : raw.toLowerCase(), ok: sep != null && /^ +$/.test(sep.replace(/\s/g, ' '))}); sep = '' }
    else sep = (sep == null ? '' : sep) + n.textContent;
  }
  const i = ws.findIndex(x => x.el === span); if (i < 0) return null;
  for (let L = 4; L >= 2; L--){
    for (let s0 = Math.max(0, i - L + 1); s0 <= i && s0 + L <= ws.length; s0++){
      const win = ws.slice(s0, s0 + L);
      if (win.slice(1).some(x => !x.ok)) continue;
      const words = win.map(x => x.t), tries = [words];
      if (fr){
        const m0 = FR_ELIDE.exec(words[0]), mL = FR_ELIDE.exec(words[L - 1]);
        if (m0) tries.push([m0[2], ...words.slice(1)]);
        if (mL && /^(d|qu)$/.test(mL[1])) tries.push([...words.slice(0, -1), FR_PRE[mL[1]][0]]);
      }
      for (const ws2 of tries){
        const phrase = ws2.join(' '), fixed = P.fixed[phrase];
        if (fixed) return {phrase, best:fixed, rec:{d:[['phrase', '', [fixed]]]}, spans:win.map(x => x.el)};
        if (ws2.every(x => P.little.has(x))) continue;
        const rec = await exact(phrase);
        if (!rec || rec.offline || !rec.d) continue;
        const g = goodEntry(rec); if (!g || !(await phraseOk(ws2, g[1][0]))) continue;
        return {phrase, best:g[0], rec, spans:win.map(x => x.el)};
      }
    }
  }
  return null;
}

PACK.en = {code:'en', name:'English', dict:'dict/en/', size:'2 MB', norm: w => w.toLowerCase().replace(/’/g, "'"), core:{}, verbFirst:new Set(), prefer:[], verbGloss:{},
  art:{}, little:new Set(), aux:new Set(), article:/^$/, inner:new Set(), fixed:{},

let P = PACK[settings.lang] || PACK.es;

/* ---------- the word card ---------- */
let current = null;
const isSaved = (w, lang) => LS.get('words', []).some(x => x.w === w && (x.lang || 'es') === lang);
async function showWord(raw, sentence, span, ctx){
  if (langOf(ctx.lang) === 'en') return showWordEn(raw, sentence, span, Object.assign({otherLang: 'es', src: 'book'}, ctx));
  usePack(ctx.lang);   // look the word up in its own book's language
  const L = P.code;
  let w = P.key(raw);
  const seq = (showWord.seq = (showWord.seq || 0) + 1);  // a slow answer for an earlier tap must not overwrite this one
  current = {w, sentence, ctx, seq, gloss:'', lemma:''};
  openSheet(`<div class="sh-head"><div class="grab" aria-hidden="true"></div><div class="sh-row"><span class="wd" lang="${L}">${esc(raw)}</span>
      <button class="say" id="sayW" aria-label="${esc(T.hearW(raw))}">${icon('sound')}</button><button class="pill" data-close>${T.close}</button></div></div>
    <div id="wbody"><div class="best wait">…</div></div>
    <div class="two"><button id="sayS">${icon('sound1','sm')}${T.playSentence}</button><button id="slowS">${icon('slow','sm')}${T.sentenceSlowly}</button></div>
    <div class="en hide" id="sentEn" lang="en"></div>
    <div id="wnotes"></div><div id="wmore"></div>`, 'word', 'Word: ' + raw);
  sheetSpan = span; requestAnimationFrame(reveal);
  $('#sayW').onclick = () => speak(raw, false, L);
  $('#sayS').onclick = () => speak(sentence, false, L);
  $('#slowS').onclick = () => speak(sentence, true, L);
  if (settings.speakTap) speak(raw, false, L);
  englishFor(sentence, ctx).then(en => {
    if (!en || current.seq !== seq || !$('#sentEn')) return;
    $('#sentEn').lang = ctx.otherLang || 'en';
    $('#sentEn').innerHTML = `<small>${T.sentIn(langName(ctx.otherLang || 'en'))}</small>${esc(en)}`; $('#sentEn').classList.remove('hide'); reveal();
  });
  const [a, ph] = await Promise.all([analyze(raw, L === 'fr' ? frContext(span) : {}), phraseAround(span)]);
  if (current.seq !== seq || !$('#wbody')) return;
  if (a.key) w = current.w = a.key;   // l'homme is saved as homme, dit-il as dit
  const sd = P.siteUrl(w);
  if (ph) ph.spans.forEach(x => x.classList.add('on'));
  if (a.status !== 'ok' && ph) a.best = '';
  // Go deeper works for everyone: the prompt needs no account; a signed-in reader's prompt also carries a Lector ref.
  const deep = true;
  $('#wnotes').innerHTML = notesHtml(L, w);
  if (a.status === 'notfound' && !ph){
    $('#wbody').innerHTML = `<p class="calm">${T.notInDict(/^\p{Lu}/u.test(raw) && raw.length > 2, `<a target="_blank" rel="noopener" href="${sd}">${T.lookItUp(P.site)}</a>`)}</p>` + (deep ? deeperRow() : '');
    if (deep) bindDeeper(raw, L, sentence, ctx, () => '');
    if (ctx.peek) peek(raw, '', 'not in the dictionary');
    return reveal();
  }
  if (a.status === 'offline' && !ph){
    $('#wbody').innerHTML = `<p class="calm">${T.dictOffline}</p>`;
    return reveal();
  }
  const gloss = ph ? `${ph.best} (${ph.phrase})` : a.best;
  current.gloss = gloss; current.lemma = a.lemma || '';
  // A phrase the dictionary knows ("pompas fúnebres") leads; the single word follows beneath it.
  $('#wbody').innerHTML = ph
    ? `<div class="phr"><small>${T.asPhrase}</small><b lang="${L}">${esc(ph.phrase)}</b></div><div class="best" lang="en">${esc(ph.best)}</div>
       <div class="alone">${T.onItsOwn(`<b lang="${L}">${esc(raw)}</b>`)}${a.best ? ': ' + esc(a.best) : ' ' + T.notInDictShort}</div>
       ${a.gram ? `<div class="gram">${a.gram}${a.det ? `<span class="det">${esc(a.det)}</span>` : ''}</div>` : ''}
       <button class="primary" id="saveW" style="margin-top:14px"></button>${deep ? deeperRow() : ''}`
    : `<div class="best" lang="en">${esc(a.best)}</div>
    ${a.gram ? `<div class="gram">${a.gram}${a.det ? `<span class="det">${esc(a.det)}</span>` : ''}</div>` : ''}
    <button class="primary" id="saveW" style="margin-top:14px"></button>${deep ? deeperRow() : ''}`;
  $('#wmore').innerHTML = `<button class="more" id="moreB" aria-expanded="false">${T.moreMeanings}${icon('next','sm')}</button><div class="defs hide" id="moreD">${ph ? `<h4 lang="${L}">${esc(ph.phrase)}</h4>` + defsHtml(ph.rec.d, ph.phrase) : ''}${a.chain ? moreHtml(a) : ''}</div>`;
  $('#moreB').onclick = () => { const open = $('#moreD').classList.toggle('hide') === false; $('#moreB').setAttribute('aria-expanded', open); $('#sheet').classList.toggle('expanded', open); requestAnimationFrame(() => { reveal(); if (open){ const sh = $('#sheet'); sh.scrollTop = $('#moreB').offsetTop - sh.querySelector('.sh-head').offsetHeight - 8 } }) };
  const paint = () => { const b = $('#saveW'), on = isSaved(w, L); b.className = on ? 'primary saved-on' : 'primary'; b.innerHTML = on ? `${icon('check','sm')}${T.savedTap}` : `${icon('mark','sm')}${T.saveWord}` };
  paint();
  $('#saveW').onclick = () => {
    let ws = LS.get('words', []);
    if (isSaved(w, L)) ws = ws.filter(x => !(x.w === w && (x.lang || 'es') === L));
    else ws.unshift(Object.assign({w, lemma:a.lemma || '', gloss, sentence, t:Date.now(), lang:L, src:ctx.src || 'book'},
      ctx.src && ctx.src !== 'book' ? ctx.srcInfo || {} : {book:ctx.title, bookId:ctx.bookId, c:ctx.c, p:ctx.p, ct:ctx.ct}));
    LS.set('words', ws); paint(); markSaved(w, L);
  };
  if (deep) bindDeeper(raw, L, sentence, ctx, () => current.gloss);
  if (ctx.peek) peek(ph ? ph.phrase : raw, ph ? ph.best : a.best, !ph && a.lemma && a.chain.length > 1 ? `from ${a.lemma}` : '');
  requestAnimationFrame(reveal);
}
function peek(word, mean, from, lang){
  const p = $('#peek'); if (!p) return;
  p.innerHTML = `<b lang="${lang || P.code}">${esc(word)}</b><span ${lang === 'en' ? 'lang="es"' : ''}>${esc(mean)}</span>${from ? `<small>${esc(from)}</small>` : ''}`; p.classList.remove('hide');
}

/* ---------- contents ---------- */
$('#openToc').onclick = () => {
  const s = book.start || 0, e = storyEnd(), back = backAt(), cp = curPara(), L = book.chapters[chap].paras.length, bl = bookLang(book);
  const inPct = Math.min(100, Math.round(100 * cp / Math.max(1, L)));
  // A French chapter titled only "XII" shows its own subtitle line under the number.
  const subOf = c => { if (bl !== 'fr' || !bareLabel(c.title)) return ''; const h = c.paras[0] || ''; return h[0] === '\u0001' ? h.slice(1) : '' };
  const item = (i, num, sub) => { const st = subOf(book.chapters[i]);
    return `<li><button data-c="${i}" class="${i === chap ? 'cur' : ''}" ${i === chap ? 'aria-current="true"' : ''}><span class="n">${num}</span><span class="tt" lang="${bl}">${esc(book.chapters[i].title)}${st ? `<small>${esc(st)}</small>` : ''}${sub ? `<small lang="en">${sub}</small>` : ''}</span>${i === chap ? `<span class="at">${esc(T.rd.reading(inPct))}</span>` : ''}</button></li>` };
  let story = '';
  for (let i = s; i < book.chapters.length; i++) story += item(i, i < e ? i - s + 1 : '', i >= back ? T.rd.after : i >= e ? T.rd.bonus : '');
  const front = book.chapters.slice(0, s).map(c => c.title.length > 26 ? c.title.slice(0, 24).trim() + '…' : c.title);
  const fold1 = t => t === t.toUpperCase() && /\p{Lu}{3}/u.test(t) ? cap(t.toLowerCase()) : t;
  const frontSum = front.length ? `${front.slice(0, 2).map(fold1).join(', ')}${front.length > 2 ? ', ' + T.rd.more(front.length - 2) : ''}` : '';
  const sh = openSheet(`${head(`<h2>${esc(T.rd.contents)}</h2>`, T.rd.done)}
    <div class="note es" lang="${bl}" style="margin-top:-8px">${esc(book.title)}${book.author ? ' · ' + esc(book.author) : ''}</div>
    <ol class="toc">${story}</ol>
    ${s ? `<button class="before" id="beforeB" aria-expanded="${chap < s}">${icon('next','sm')}<span>${T.rd.beforeL(`<span lang="${bl}">${esc(frontSum)}</span>`)}</span></button>
      <ol class="toc ${chap < s ? '' : 'hide'}" id="beforeL">${book.chapters.slice(0, s).map((c, i) => item(i, '', '')).join('')}</ol>` : ''}`, 'tall', T.rd.contents);
  sh.querySelectorAll('[data-c]').forEach(b => b.onclick = () => showChapter(+b.dataset.c));
  const bb = $('#beforeB'); if (bb) bb.onclick = () => { const open = $('#beforeL').classList.toggle('hide') === false; bb.setAttribute('aria-expanded', open) };
  const cur = sh.querySelector('.cur'); if (cur) requestAnimationFrame(() => cur.scrollIntoView({block:'center'}));
};

/* ---------- look ---------- */
let lookMore = false;
function openLook(){
